<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Upload - TKJ OnE</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>

  <div class="main-content">
    <button class="main-upload-btn" id="triggerBtn" aria-label="Pilih gambar">
      <svg viewBox="0 0 25 25" width="32" height="32"><path fill="currentColor" d="M17,3L5,3c-1.11,0 -2,0.9 -2,2v14c0,1.1 0.89,2 2,2h14c1.1,0 2,-0.9 2,-2L21,7l-4,-4zM12,19c-1.66,0 -3,-1.34 -3,-3s1.34,-3 3,-3 3,1.34 3,3 -1.34,3 -3,3zM15,9L5,9L5,5h10v4z"/></svg>
    </button>
    <p class="upload-hint">Pilih foto dari galeri untuk diajukan<br/>ke admin TKJ OnE</p>
  </div>

  <!-- UPLOAD UI -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <img id="modalPreview" alt="Preview" />
      <p>Yakin pengen upload gambar ini?</p>
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" id="cancelBtn">Bercanda aja</button>
        <button class="modal-btn btn-upload" id="confirmUploadBtn">Yakin dong</button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">📤 Mengupload...</div>

  <div class="result-section" id="resultSection">
    <img class="uploaded-preview" id="uploadedImg" alt="Uploaded" />
    <div class="result-link" id="resultLink"></div>

    <div class="form-group">
      <label>Jenis Foto:</label>
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="gender" value="all"> Foto bersama</label>
        <label class="radio-option"><input type="radio" name="gender" value="male"> Laki-laki</label>
        <label class="radio-option"><input type="radio" name="gender" value="female"> Perempuan</label>
      </div>
    </div>

    <div class="form-group">
      <label for="senderName">Nama Pengirim (wajib):</label>
      <input type="text" id="senderName" placeholder="Isi dengan nama asli kamu..." maxlength="50" autocomplete="name" />
    </div>

    <div class="form-group">
      <label for="userDesc">Deskripsi foto (opsional):</label>
      <textarea id="userDesc" rows="2" placeholder="Ceritakan sesuatu tentang foto ini..."></textarea>
    </div>

    <div class="code-preview" id="codePreview">
       {
        "name": "",
        "gender": "...",
        "url": "https://...",
        "date": "YYYY-MM-DD"
       }
    </div>

    <button class="send-btn disabled" id="sendBtn">Konfirmasi</button>
  </div>
  <input type="file" id="fileInput" style="display:none;" />

  <script src="./script.js"></script>
</body>
</html>
