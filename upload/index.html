<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0B1220">
  <title>Upload Foto - TKJ OnE</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <span class="app-title">TKJ OnE</span>
    <span class="app-subtitle">Galeri Kelas</span>
  </header>

  <!-- ===== LANGKAH 1 : PILIH FOTO ===== -->
  <main class="main-content" id="mainContent">
    <button class="main-upload-btn" id="triggerBtn" aria-label="Pilih gambar">
      <svg viewBox="0 0 24 24" width="36" height="36"><path fill="currentColor" d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 13l-3.5-4.5 2.05-2.6L12 12.5l2.45-3.1L17 14h-5z"/></svg>
    </button>
    <p class="upload-hint">Pilih foto dari galeri untuk diunggah<br/>ke album kelas TKJ OnE</p>
  </main>

  <!-- ===== FORM DATA (LANGKAH 3) ===== -->
  <section class="form-section" id="formSection" aria-hidden="true">
    <h2 class="form-title">Detail Foto</h2>

    <div class="preview-wrap">
      <img class="uploaded-preview" id="uploadedImg" alt="Preview foto" />
    </div>

    <div class="form-group">
      <label for="photoName">Nama Foto <span class="req">(wajib)</span></label>
      <input type="text" id="photoName" placeholder="Contoh: Kenangan kelas XI" maxlength="60" autocomplete="off" />
    </div>

    <div class="form-group">
      <label for="photoDate">Tanggal <span class="req">(wajib)</span></label>
      <input type="date" id="photoDate" />
    </div>

    <div class="form-group">
      <label for="uploaderName">Uploader — Nama Kamu <span class="req">(wajib)</span></label>
      <input type="text" id="uploaderName" placeholder="Isi dengan nama kamu sendiri..." maxlength="50" autocomplete="name" />
    </div>

    <div class="form-group">
      <label>Jenis Foto:</label>
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="gender" value="all" checked> Foto bersama</label>
        <label class="radio-option"><input type="radio" name="gender" value="male"> Laki-laki</label>
        <label class="radio-option"><input type="radio" name="gender" value="female"> Perempuan</label>
      </div>
    </div>

    <div class="code-preview" id="codePreview" aria-live="polite"></div>

    <button class="submit-btn disabled" id="submitBtn" type="button">UPLOAD</button>
  </section>

  <!-- ===== PROGRESS OVERLAY ===== -->
  <div class="progress-overlay" id="progressOverlay" aria-hidden="true">
    <div class="progress-card">
      <div class="progress-icon" id="progressIcon">📤</div>
      <div class="progress-step" id="progressStep">Menyiapkan...</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>
  </div>

  <!-- ===== HASIL ===== -->
  <section class="result-section" id="resultSection" aria-hidden="true">
    <div class="result-icon" id="resultIcon">✅</div>
    <h2 class="result-title" id="resultTitle">Berhasil!</h2>
    <p class="result-desc" id="resultDesc"></p>
    <div class="result-link" id="resultLink"></div>
    <button class="submit-btn enabled" id="againBtn" type="button">UPLOAD LAGI</button>
  </section>

  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;" />

  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
