<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0B1220" />
        <link rel="icon" type="image/webp" href="../assets/ic.webp" />
        <title>Anggota Kelas — TKJ 1 — SMKN 1 Lembah Melintang</title>
        <meta
            name="description"
            content="Daftar anggota kelas TKJ 1, Kompetensi Keahlian Teknik Komputer dan Jaringan — SMKN 1 Lembah Melintang."
        />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://tkj1.pages.dev/student/" />
        <meta property="og:title" content="Anggota Kelas — TKJ 1 — SMKN 1 Lembah Melintang" />
        <meta
            property="og:description"
            content="Daftar anggota kelas TKJ 1, Kompetensi Keahlian Teknik Komputer dan Jaringan — SMKN 1 Lembah Melintang."
        />
        <meta property="og:image" content="https://tkj1.pages.dev/assets/ic.webp" />
        <meta property="twitter:card" content="summary_large_image" />

        <link href="../assets/fa/css/all.min.css" rel="stylesheet" />
        <link href="../assets/theme.css" rel="stylesheet" />
        <link href="../assets/landing.css" rel="stylesheet" />
    </head>
    <body>
        <!-- ===================== Navbar ===================== -->
        <nav class="nav" id="nav">
            <div class="nav-inner">
                <a class="nav-brand" href="../"
                    ><img src="../assets/tkjlogo.png" width="143" height="40" alt="Logo TKJ 1"
                /></a>
                <button
                    class="nav-toggler"
                    id="navToggler"
                    type="button"
                    aria-label="Buka menu"
                    aria-expanded="false"
                    aria-controls="navMenu"
                >
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="../">Home</a></li>
                    <li><a href="./" class="active">Members</a></li>
                </ul>
            </div>
        </nav>

        <main class="landing">
            <!-- ===================== Header halaman ===================== -->
            <section class="section" id="daftar">
                <div class="container">
                    <div class="sec-head reveal">
                        <h3>Anggota Kelas</h3>
                        <p>Seluruh anggota kelas TKJ 1 periode ini. Klik nama untuk mengunjungi Instagram siswa.</p>
                    </div>
                    <div class="members-list" id="membersList"></div>
                    <p class="members-empty" id="membersEmpty" hidden>
                        Daftar anggota belum tersedia. Silakan cek kembali nanti.
                    </p>
                </div>
            </section>

            <footer class="footer-copy">
                <p>
                    <span id="year">2026</span> &copy; TKJ 1 · SMKN 1 Lembah Melintang.<br />Dikelola oleh siswa
                    <b>TKJ 1</b>.
                </p>
            </footer>
        </main>

        <script>
            "use strict";

            /* ==========================================================
               DATA ANGGOTA — edit bagian ini untuk mengubah daftar siswa.
               Tambahkan field "instagram" per siswa (username IG pribadi).
               ========================================================== */
            const ANGGOTA = [
                // { nama: "Nama Siswa", foto: "../photo/nama.webp", instagram: "@username_ig" },
            ];

            /* ---------- Helper ---------- */
            const $ = id => document.getElementById(id);
            const esc = v =>
                String(v ?? "").replace(
                    /[&<>"']/g,
                    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
                );
            const initials = name => {
                const parts = String(name || "?")
                    .trim()
                    .split(/\s+/)
                    .filter(Boolean);
                return ((parts[0]?.[0] || "?") + (parts[1]?.[0] || "")).toUpperCase();
            };
            const avatarText = name => {
                const n = String(name || "").trim();
                if (!n || /[\s^][A-Za-z]$/.test(n)) return "•";
                return initials(n);
            };
            const igLink = handle => {
                const h = String(handle || "").trim().replace(/^@/, "");
                return h ? "https://www.instagram.com/" + h + "/" : "";
            };

            /* ---------- Render daftar anggota (3 kolom, 3 baris ke bawah, foto + nama) ---------- */
            function renderMembers() {
                const list = $("membersList");
                const items = Array.isArray(ANGGOTA) ? ANGGOTA.filter(a => a && String(a.nama || "").trim()) : [];
                if (!items.length) {
                    $("membersEmpty").hidden = false;
                    return;
                }
                list.innerHTML = items
                    .map(m => {
                        const name = String(m.nama || "").trim();
                        const visual = m.foto
                            ? '<img src="' +
                              esc(m.foto) +
                              '" alt="' +
                              esc(name) +
                              '" loading="lazy" decoding="async" />'
                            : '<div class="avatar">' + esc(avatarText(name)) + "</div>";
                        const link = igLink(m.instagram);
                        const nameHtml = link
                            ? '<a class="member-name" href="' +
                              esc(link) +
                              '" target="_blank" rel="noopener noreferrer">' +
                              esc(name) +
                              "</a>"
                            : '<span class="member-name">' + esc(name) + "</span>";
                        return (
                            '<div class="member-cell reveal">' +
                            '<div class="member-media">' +
                            visual +
                            "</div>" +
                            nameHtml +
                            "</div>"
                        );
                    })
                    .join("");
            }

            /* ---------- Navbar & scroll ---------- */
            function bindNav() {
                const nav = $("nav");
                const menu = $("navMenu");
                const toggler = $("navToggler");
                toggler.addEventListener("click", () => {
                    const open = menu.classList.toggle("open");
                    toggler.setAttribute("aria-expanded", open ? "true" : "false");
                    toggler.querySelector("i")?.classList.toggle("fa-xmark", open);
                    toggler.querySelector("i")?.classList.toggle("fa-bars", !open);
                });
                menu.addEventListener("click", e => {
                    if (e.target.closest("a")) {
                        menu.classList.remove("open");
                        toggler.setAttribute("aria-expanded", "false");
                        toggler.querySelector("i")?.classList.remove("fa-xmark");
                        toggler.querySelector("i")?.classList.add("fa-bars");
                    }
                });
                const onScroll = () => nav.classList.toggle("scrolled", window.scrollY > 50);
                window.addEventListener("scroll", onScroll, { passive: true });
                onScroll();
            }

            /* ---------- Animasi masuk ---------- */
            function bindReveal() {
                const items = document.querySelectorAll(".reveal:not(.in)");
                if (!("IntersectionObserver" in window)) {
                    items.forEach(el => el.classList.add("in"));
                    return;
                }
                const io = new IntersectionObserver(
                    entries => {
                        entries.forEach(en => {
                            if (en.isIntersecting) {
                                en.target.classList.add("in");
                                io.unobserve(en.target);
                            }
                        });
                    },
                    { threshold: 0.12 },
                );
                items.forEach(el => io.observe(el));
            }

            /* ---------- Mulai ---------- */
            $("year").textContent = new Date().getFullYear();
            renderMembers();
            bindNav();
            bindReveal();
        </script>
    </body>
</html>
