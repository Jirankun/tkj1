name: Inject LD & memberlist

# Membangun student/index.html dari sumber JSON di folder data/:
#   data/ld.json         -> isi <script type="application/ld+json"> di <head>
#   data/memberlist.json -> blok kartu anggota di dalam .container section#daftar
#
# Semua data ada di JSON; HTML kartu anggota dibuat oleh scripts/build-student.py.
# Halaman student/ adalah template: komentar di dalamnya menandai tempat suntikan.
# Workflow ini idempoten — kalau student/index.html sudah sesuai data/, tidak ada commit.
#
# Catatan token: push memakai G_UPLOAD_TOKEN (PAT) supaya commit hasil build
# ikut memicu web-deploy.yml. Push dengan GITHUB_TOKEN bawaan tidak memicu
# workflow lain, jadi situs tidak akan ter-deploy otomatis (fallback tetap dipakai
# bila secret belum diisi).

# Trigger: push ke main yang menyentuh data/** atau scripts/build-student.py,
# atau dijalankan manual dari tab Actions. student/** sengaja tidak ikut supaya
# commit hasil build tidak memicu run kedua. Kalau student/index.html diedit
# manual, jalankan workflow ini sekali dari tab Actions agar bloknya dibangun ulang.
# Upload galeri TIDAK memicu workflow ini: alur foto menulis DB/photos.json lewat
# add-photo.yml / GitHub Contents API, dan berkas itu sengaja tidak ada di paths.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build-student.py"
      - ".github/workflows/inject-ld-and-memberlist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inject-ld-and-memberlist
  cancel-in-progress: false

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.G_UPLOAD_TOKEN || github.token }}

      - name: Build student/index.html dari data/*.json
        run: python3 scripts/build-student.py

      - name: Commit perubahan
        run: |
          git config user.name "tkjone-bot"
          git config user.email "tkjone-bot@users.noreply.github.com"
          if git diff --quiet -- student/index.html; then
            echo "Tidak ada perubahan untuk di-commit"
            exit 0
          fi
          git add student/index.html
          git commit -m "chore(seo): bangun ulang JSON-LD dan memberlist di student/index.html dari data/*.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
