name: Add comment

# Menerima komentar dari Cloudflare Pages Function (/api/komentar) lewat
# repository_dispatch "add-comment", membersihkan HTML-nya, lalu append ke
# DB/komentar.json.
#
# Tidak ada jalur hapus dari web. Admin hanya bisa menyembunyikan pesan dengan
# mengubah "status": false di DB/komentar.json, atau menghapus entrinya manual.
#
# Berkas ini dipanggil oleh functions/api/komentar.js. Token ditulis di Function,
# bukan di browser.

on:
  repository_dispatch:
    types: [add-comment]

permissions:
  contents: write

concurrency:
  group: add-comment
  cancel-in-progress: false

jobs:
  add-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.G_UPLOAD_TOKEN }}

      - name: Tambahkan komentar ke DB/komentar.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          COMMENT_DB: DB/komentar.json
        run: |
          python3 - <<'PY'
          import datetime, html, json, os, pathlib, re, sys, uuid
          from html.parser import HTMLParser

          MAX_TEXT = 500
          MAX_NAME = 40
          MAX_HTML = 4000
          MAX_TAGS = 600

          NAMED_COLORS = {
              "black", "white", "red", "green", "blue", "yellow", "orange", "purple",
              "pink", "teal", "cyan", "magenta", "lime", "navy", "maroon", "olive",
              "silver", "aqua", "fuchsia", "gray", "grey", "brown", "gold", "violet",
              "indigo", "turquoise", "tomato", "coral", "salmon", "khaki", "beige",
              "ivory", "crimson",
          }
          RGB_RE = re.compile(
              r"rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*(?:,\s*(?:0|1|0?\.\d+)\s*)?\)"
          )
          # Tag void: cukup dibuang tag-nya, isi setelahnya tetap diproses.
          VOID_DROP = {
              "img", "embed", "input", "link", "meta", "source", "track", "wbr",
              "col", "area", "base", "param", "hr",
          }
          # Wadah berbahaya: tag beserta seluruh isinya dibuang.
          DROP_CONTENT = {
              "script", "style", "iframe", "object", "svg", "math", "form", "button",
              "textarea", "select", "video", "audio", "template", "noscript",
          }
          BLOCK_TAGS = {
              "div", "p", "li", "ul", "ol", "blockquote", "pre", "section", "article",
              "table", "tr", "td", "th", "h1", "h2", "h3", "h4", "h5", "h6",
          }
          ALLOWED_TAGS = {"b", "strong", "i", "em", "u", "s", "strike", "del", "br", "span", "font"}


          def safe_color(value):
              v = (value or "").strip().lower()
              if re.fullmatch(r"#[0-9a-f]{3,8}", v):
                  return v
              if v in NAMED_COLORS:
                  return v
              match = RGB_RE.fullmatch(v)
              if match and all(int(part) <= 255 for part in match.groups()):
                  return v
              return ""


          class Sanitizer(HTMLParser):
              """Hanya izinkan format inline; semua tag/atribut lain dibuang."""

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.out = []
                  self.stack = []
                  self.skip = 0
                  self.started = False
                  self.chars = 0
                  self.size = 0
                  self.tags = 0

              def emit(self, text):
                  if self.size + len(text) > MAX_HTML:
                      return
                  self.out.append(text)
                  self.size += len(text)
                  self.tags += 1

              def start(self, tag, attrs):
                  if self.tags >= MAX_TAGS:
                      return
                  if tag == "font":
                      color = safe_color(dict(attrs).get("color"))
                      if color:
                          self.emit('<span style="color:%s">' % color)
                          self.stack.append("span")
                      else:
                          self.stack.append("")
                      return
                  if tag == "span":
                      color = ""
                      for name, value in attrs:
                          if name == "style" and value:
                              for part in value.split(";"):
                                  if ":" not in part:
                                      continue
                                  prop, val = part.split(":", 1)
                                  if prop.strip().lower() == "color":
                                      color = safe_color(val)
                      if color:
                          self.emit('<span style="color:%s">' % color)
                          self.stack.append("span")
                      else:
                          self.stack.append("")
                      return
                  self.emit("<%s>" % tag)
                  self.stack.append(tag)

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag in VOID_DROP:
                      return
                  if tag in DROP_CONTENT:
                      self.skip += 1
                      return
                  if self.skip:
                      return
                  if tag in BLOCK_TAGS:
                      if self.started:
                          self.emit("<br>")
                      return
                  if tag == "br":
                      self.emit("<br>")
                      self.started = True
                      return
                  if tag not in ALLOWED_TAGS:
                      return
                  self.started = True
                  self.start(tag, attrs)

              def handle_startendtag(self, tag, attrs):
                  tag = tag.lower()
                  self.handle_starttag(tag, attrs)
                  if tag in ALLOWED_TAGS and tag != "br":
                      self.handle_endtag(tag)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag in DROP_CONTENT:
                      if self.skip:
                          self.skip -= 1
                      return
                  if self.skip:
                      return
                  if tag in BLOCK_TAGS or tag not in ALLOWED_TAGS:
                      return
                  target = "span" if tag == "font" else tag
                  for index in range(len(self.stack) - 1, -1, -1):
                      opened = self.stack[index]
                      if opened == target:
                          if opened:
                              self.emit("</%s>" % opened)
                          del self.stack[index]
                          break

              def handle_data(self, data):
                  if self.skip:
                      return
                  data = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]", "", data)
                  remaining = MAX_TEXT - self.chars
                  if remaining <= 0:
                      return
                  data = data[:remaining]
                  self.chars += len(data)
                  if data:
                      self.started = True
                      self.emit(html.escape(data, quote=False))

              def result(self):
                  while self.stack:
                      opened = self.stack.pop()
                      if opened:
                          self.out.append("</%s>" % opened)
                  text = "".join(self.out)
                  text = re.sub(r"(?:<br>\s*){3,}", "<br><br>", text)
                  text = re.sub(r"^(?:\s*<br>)+", "", text)
                  text = re.sub(r"(?:<br>\s*)+$", "", text)
                  return text.strip()


          def clean_comment(raw):
              if not isinstance(raw, str):
                  return ""
              raw = raw.strip()
              if len(raw) > MAX_HTML * 2:
                  raw = raw[: MAX_HTML * 2]
              parser = Sanitizer()
              parser.feed(raw)
              parser.close()
              return parser.result()


          def clean_name(raw):
              if not isinstance(raw, str):
                  return "Anonim"
              name = re.sub(r"<[^>]*>", "", raw)
              name = re.sub(r"[\x00-\x1f\x7f]", "", name)
              name = re.sub(r"\s+", " ", name).strip()
              return name[:MAX_NAME] or "Anonim"


          def plain_text(markup):
              text = re.sub(r"<br\s*/?>", " ", markup, flags=re.I)
              text = re.sub(r"<[^>]*>", "", text)
              text = html.unescape(text).replace("\u00a0", " ")
              return re.sub(r"\s+", " ", text).strip()


          payload = {}
          raw_payload = os.environ.get("PAYLOAD", "").strip()
          if raw_payload and raw_payload not in ("null", "{}"):
              try:
                  payload = json.loads(raw_payload)
              except json.JSONDecodeError:
                  print("client_payload bukan JSON yang valid")
                  sys.exit(1)

          name = clean_name(payload.get("name"))
          comment = clean_comment(payload.get("comment"))

          if not plain_text(comment):
              print("Komentar kosong setelah dibersihkan")
              sys.exit(1)

          cid = str(payload.get("id") or "").strip().lower()
          if not re.fullmatch(r"[a-z0-9-]{6,40}", cid):
              cid = uuid.uuid4().hex[:12]

          stamp = datetime.datetime.now(datetime.timezone.utc)
          time_text = stamp.isoformat(timespec="seconds").replace("+00:00", "Z")

          path = pathlib.Path(os.environ["COMMENT_DB"])
          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "[]")
              except json.JSONDecodeError:
                  print("DB/komentar.json bukan JSON yang valid")
                  sys.exit(1)
          else:
              data = []

          if not isinstance(data, list):
              print("DB/komentar.json harus berupa array")
              sys.exit(1)

          if any(str(item.get("id", "")) == cid for item in data if isinstance(item, dict)):
              print("Komentar %s sudah ada, tidak ada yang diubah" % cid)
              sys.exit(0)

          data.append({
              "id": cid,
              "name": name,
              "comment": comment,
              "status": True,
              "time": time_text,
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Ditambahkan komentar %s dari %s" % (cid, name))
          PY

      - name: Commit perubahan
        run: |
          git config user.name "tkjone-bot"
          git config user.email "tkjone-bot@users.noreply.github.com"
          if git diff --quiet -- DB/komentar.json; then
            echo "Tidak ada perubahan untuk di-commit"
            exit 0
          fi
          git add DB/komentar.json
          git commit -m "chore(komentar): tambah pesan baru ke komentar.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
