name: Deploy web

# Deploy ke Cloudflare Pages.
# Upload config dan ImgBB API key sudah tertulis langsung di upload/config.js,
# jadi tidak perlu inject secret lagi di sini.
#
# Secrets yang dibutuhkan:
#   CLOUDFLARE_API_TOKEN     token Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID    account id Cloudflare
#   CLOUDFLARE_PROJECT_NAME  nama project Pages (mis. tkj1)

on:
    push:
        branches: [main]
        paths:
            - "**"
            - "!.github/workflows/web-deploy.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: web-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy ke Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy . --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tkj1' }} --branch=${{ github.ref_name }}
