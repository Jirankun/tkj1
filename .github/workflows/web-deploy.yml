name: Deploy web

# Deploy ke Cloudflare Pages.
# Upload config dan ImgBB API key sudah tertulis langsung di code/js/gallery/upload-config.js,
# jadi tidak perlu inject secret lagi di sini.
#
# Secrets yang dibutuhkan:
#   CLOUDFLARE_API_TOKEN     token Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID    account id Cloudflare
#   CLOUDFLARE_PROJECT_NAME  nama project Pages (mis. tkj1)

on:
    push:
        branches: [main]
        paths:
            - "**"
            - "!.github/workflows/web-deploy.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: web-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Inject secrets ke upload-config.js
              env:
                  G_UPLOAD_TOKEN: ${{ secrets.G_UPLOAD_TOKEN }}
              run: |
                  python3 - <<'PY'
                  import os, re, sys
                  path = 'code/js/gallery/upload-config.js'
                  text = open(path, encoding='utf-8').read()
                  token = os.environ.get('G_UPLOAD_TOKEN', '')
                  # Ganti GITHUB_TOKEN: "..." dengan token dari secret
                  pattern = r'(GITHUB_TOKEN\s*:\s*")[^"]*(")'
                  if re.search(pattern, text):
                      text2 = re.sub(pattern, r'\1' + token.replace('\\', '\\\\').replace('"', '\\"') + r'\2', text)
                      if text2 != text:
                          open(path, 'w', encoding='utf-8').write(text2)
                          print('Injected G_UPLOAD_TOKEN into code/js/gallery/upload-config.js')
                          sys.exit(0)
                  print('Failed to inject token into code/js/gallery/upload-config.js', file=sys.stderr)
                  sys.exit(1)
                  PY

            - name: Deploy ke Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy . --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tkj1' }} --branch=${{ github.ref_name }}
