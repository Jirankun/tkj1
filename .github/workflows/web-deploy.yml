name: Deploy web + inject upload config

# Injeksi rahasia upload ke upload/config.js HANYA di runner, lalu deploy
# ke Cloudflare Pages. Tidak ada token yang ikut ter-commit.
#
# Secrets yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   IMGBB_API_KEY            API key ImgBB
#   GH_UPLOAD_TOKEN          fine-grained PAT, Contents: Read & Write (repo ini)
#   CLOUDFLARE_API_TOKEN     token Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID    account id Cloudflare
#   CLOUDFLARE_PROJECT_NAME  nama project Pages (mis. tkj1)

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!.github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek secrets wajib
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GH_UPLOAD_TOKEN: ${{ secrets.GH_UPLOAD_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$IMGBB_API_KEY" ] && missing="$missing IMGBB_API_KEY"
          [ -z "$GH_UPLOAD_TOKEN" ] && missing="$missing GH_UPLOAD_TOKEN"
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Secret belum diisi:$missing"
            exit 1
          fi

      - name: Inject upload/config.js
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GH_UPLOAD_TOKEN: ${{ secrets.GH_UPLOAD_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("upload/config.js")
          s = p.read_text(encoding="utf-8")
          values = {
              "IMGBB_API_KEY": os.environ["IMGBB_API_KEY"],
              "GITHUB_TOKEN": os.environ["GH_UPLOAD_TOKEN"],
              "GITHUB_REPO": os.environ.get("GITHUB_REPOSITORY", ""),
              "GITHUB_BRANCH": os.environ.get("GITHUB_REF_NAME", "main"),
          }
          for key, val in values.items():
              if val:
                  s = s.replace(f'{key}: ""', f'{key}: {json.dumps(val)}', 1)
          p.write_text(s, encoding="utf-8")
          print("config.js diinjeksi untuk deploy")
          PY

      - name: Deploy ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tkj1' }} --branch=${{ github.ref_name }}
