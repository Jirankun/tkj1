<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- Plyr CSS (self-hosted, tanpa CDN) -->
  <link rel="stylesheet" href="./plyr.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0;
      margin: 0;
    }

    /* === PLAYER FULLSCREEN === */
    #player-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 1000;
      visibility: visible;
      opacity: 1;
    }

    #my-video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;      object-fit: contain;
      display: block !important;
      visibility: visible !important;
    }

    /* Plyr custom styling for fullscreen */
    .plyr {
      width: 100%;
      height: 100%;
      display: block !important;
      visibility: visible !important;
    }

    .plyr__video-wrapper {
      width: 100%;
      height: 100%;
      display: block !important;
      visibility: visible !important;
    }

    .plyr video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block !important;
      visibility: visible !important;
    }

    /* === HIDE FULLSCREEN BUTTON === */
    .plyr__controls__item.plyr__fullscreen {
      display: none !important;
    }
  </style>
</head>
<body>

<!-- === PLAYER === -->
<div id="player-container">
  <!-- === MUNTED DIHAPUS, SUARA NYALA === -->
  <video id="my-video" controls crossorigin playsinline autoplay>
    <source src="" type="video/mp4"/>
  </video>
</div>

<!-- Plyr JS (self-hosted, tanpa CDN) -->
<script src="./plyr.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // === GET VIDEO URL FROM QUERY PARAM ===
  function getVideoUrl() {    const params = new URLSearchParams(window.location.search);
    return params.get('video') || '';
  }

  // === INISIALISASI PLYR ===
  const video = document.getElementById('my-video');
  let player;
  
  if (typeof Plyr !== 'undefined') {
    player = new Plyr(video, {
      // === FULLSCREEN BUTTON DIHAPUS DARI CONTROLS ===
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay'],
      settings: ['quality', 'speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
      // === DISABLE KEYBOARD SHORTCUT FOR FULLSCREEN ===
      keyboard: { focused: true, global: true }
    });
  } else {
    video.controls = true;
    // Hide native fullscreen button if Plyr fails to load
    const nativeControls = video.shadowRoot?.querySelector('controls') || video;
    nativeControls.setAttribute('controlsList', 'nofullscreen');
  }

  // === SET VIDEO URL ===
  const videoUrl = getVideoUrl();
  console.log('Video URL:', videoUrl);
  
  if (videoUrl) {
    video.src = videoUrl;
    video.load();
    
    if (player) {
      player.on('ready', () => {
        // Force resize to ensure proper fit
        setTimeout(() => {
          window.dispatchEvent(new Event('resize'));
        }, 100);
        
        // === PLAY DENGAN SUARA ===
        video.play().catch(e => {
          console.log('Autoplay dengan suara mungkin diblokir browser:', e);
          // Kalau autoplay diblokir karena policy browser, user tinggal klik play manual
          // Volume tetap normal, gak muted
        });
      });
    }
  }

  // === BLOCK FULLSCREEN VIA API / KEYBOARD ===  // Mencegah fullscreen via tombol F atau API
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') {
      e.preventDefault();
      e.stopPropagation();
    }
  });

  // === HANDLE WINDOW RESIZE ===
  window.addEventListener('resize', () => {
    const container = document.getElementById('player-container');
    container.style.width = window.innerWidth + 'px';
    container.style.height = window.innerHeight + 'px';
  });

  // === BLOCK NATIVE FULLSCREEN API ===
  // Mencegah request fullscreen dari script lain
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  });
  
  // Block vendor prefixed fullscreen events too
  document.addEventListener('webkitfullscreenchange', () => {
    if (document.webkitFullscreenElement) {
      document.webkitExitFullscreen?.();
    }
  });
});
</script>
</body>
</html>
