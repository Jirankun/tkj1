<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Error — Load</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #tapScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    cursor: pointer;
    z-index: 10;
    user-select: none;
  }

  #tapScreen p {
    color: #333;
    font-size: 20px;
    letter-spacing: 1px;
  }

  #videoContainer {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    z-index: 20;
  }

  #videoContainer video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  /* Sembunyikan semua kontrol video bawaan browser */
  video::-webkit-media-controls {
    display: none !important;
  }
  video::-webkit-media-controls-enclosure {
    display: none !important;
  }
</style>
</head>
<body>

  <!-- Halaman putih dengan tulisan tap to refresh -->
  <div id="tapScreen">
    <p>Tap to Refresh</p>
  </div>

  <!-- Container video fullscreen -->
  <div id="videoContainer">
    <video id="myVideo" playsinline webkit-playsinline preload="auto" muted></video>
  </div>

<script>
  const tapScreen = document.getElementById('tapScreen');
  const videoContainer = document.getElementById('videoContainer');
  const video = document.getElementById('myVideo');

  // Ganti URL ini dengan sumber video Anda
  const VIDEO_SRC = 'video.mp4';

  let isPlaying = false;

  tapScreen.addEventListener('click', function () {
    if (isPlaying) return;
    isPlaying = true;

    // Sembunyikan halaman tap
    tapScreen.style.display = 'none';

    // Tampilkan container video
    videoContainer.style.display = 'block';

    // Set sumber video
    video.src = VIDEO_SRC;

    // Pastikan tanpa kontrol
    video.controls = false;
    video.autoplay = true;
    video.playsInline = true;

    // Coba play (dipicu oleh user gesture = tap, jadi autoplay diizinkan)
    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(function (err) {
        console.warn('Autoplay gagal:', err);
        // Fallback: jika perlu, unmute lalu coba play lagi
        video.muted = false;
        video.play().catch(function (e) {
          console.error('Gagal memutar video:', e);
        });
      });
    }
  });

  // Opsional: saat video selesai, kembali ke halaman tap (refresh state)
  video.addEventListener('ended', function () {
    videoContainer.style.display = 'none';
    tapScreen.style.display = 'flex';
    isPlaying = false;
    video.pause();
    video.currentTime = 0;
  });
</script>

</body>
</html>
