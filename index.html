<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Error — Load</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}#tapScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;z-index:10;user-select:none}#tapScreen p{color:#333;font-size:20px;letter-spacing:1px}#videoContainer{position:fixed;inset:0;background:#000;display:none;z-index:20}#videoContainer video{width:100%;height:100%;object-fit:cover;background:#000}video::-webkit-media-controls{display:none!important}video::-webkit-media-controls-enclosure{display:none!important}
</style>
</head>
<body>
<div id="tapScreen"><p>Tap to Refresh</p></div>
<div id="videoContainer"><video id="myVideo" playsinline webkit-playsinline preload="auto"></video></div>
<script>
const tapScreen=document.getElementById('tapScreen');
const videoContainer=document.getElementById('videoContainer');
const video=document.getElementById('myVideo');
const VIDEO_SRC='video.mp4';
let isPlaying=false;
tapScreen.addEventListener('click',function(){
if(isPlaying)return;
isPlaying=true;
tapScreen.style.display='none';
videoContainer.style.display='block';
video.src=VIDEO_SRC;
video.controls=false;
video.autoplay=true;
video.playsInline=true;
video.muted=false;
video.play().catch(function(err){console.warn('Gagal play:',err)});
});
video.addEventListener('ended',function(){
videoContainer.style.display='none';
tapScreen.style.display='flex';
isPlaying=false;
video.pause();
video.currentTime=0;
});
</script>
</body>
</html>
