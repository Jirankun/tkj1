<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<meta name="description" content="Galeri foto dan video kelas." />
<title>Galeri Foto & Video Kelas</title>
<link rel="stylesheet" href="./assets/theme.css" />
</head>
<body>

<main class="page">

  <a class="dl-banner" href="https://github.com/Jirankun/TKJ-One/releases/latest" target="_blank" rel="noopener noreferrer">
    <span class="dl-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17 1H7a3 3 0 0 0-3 3v16a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V4a3 3 0 0 0-3-3Zm1 17H6V5h12v13Zm-6 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>
    </span>
    <span class="dl-text">
      <strong>Aplikasi TKJ OnE</strong>
      <small>Unduh versi terbaru untuk Android</small>
    </span>
    <span class="dl-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13v5H5v-5H3v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-2ZM12 15l-4-4 1.4-1.4L11 11.2V3h2v8.2l1.6-1.6L16 11l-4 4Z"/></svg>
      Unduh
    </span>
  </a>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
    <input
      class="search-input"
      id="searchInput"
      type="search"
      inputmode="search"
      placeholder="Cari foto atau nama uploader"
      autocomplete="off"
      aria-label="Cari foto"
    />
  </div>

  <div class="chips" role="group" aria-label="Filter jenis media">
    <button class="chip" type="button" data-filter="all" aria-pressed="true">Semua</button>
    <button class="chip" type="button" data-filter="photo" aria-pressed="false">Foto</button>
    <button class="chip" type="button" data-filter="video" aria-pressed="false">Video</button>
  </div>

  <p class="card-meta" id="countLine" style="margin:0 0 10px 2px;"></p>

  <div class="grid" id="grid" aria-live="polite"></div>

  <div class="state hidden" id="stateBox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg>
    <span class="state-title" id="stateTitle">Gagal memuat galeri</span>
    <span class="state-text" id="stateText">Periksa koneksi internet lalu coba lagi.</span>
    <button class="btn btn-ghost" id="retryBtn" type="button" style="max-width:220px;">Coba Lagi</button>
  </div>

</main>

<nav class="tabbar" aria-label="Navigasi utama">
  <a class="tab" href="./index.html" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Zm-2 0H5v14h14V5Zm-9.5 9.5L7 11l-2 3h14l-3.5-5-2.5 3-1.5-1.5-1 1Z"/></svg>
    <span>Galeri</span>
  </a>
  <a class="tab" href="./story/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7V7Z"/></svg>
    <span>Cerita</span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const DB_URL = './DB/photos.json';

const el = {
  grid: document.getElementById('grid'),
  search: document.getElementById('searchInput'),
  chips: Array.from(document.querySelectorAll('.chip')),
  count: document.getElementById('countLine'),
  state: document.getElementById('stateBox'),
  stateTitle: document.getElementById('stateTitle'),
  stateText: document.getElementById('stateText'),
  retry: document.getElementById('retryBtn'),
  toast: document.getElementById('toast')
};

let allItems = [];
let query = '';
let filter = 'all';
let toastTimer = null;

function showToast(msg) {
  if (!el.toast) return;
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2200);
}

function normUrl(u) {
  return String(u || '').replace(/\s+/g, '').trim();
}

function isVideo(item) {
  const url = normUrl(item.url);
  return String(item.type || '').toLowerCase() === 'video' ||
    /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url);
}

function normalize(raw) {
  const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.entries) ? raw.entries : []);
  return list
    .filter((p) => p && typeof p === 'object')
    .map((p) => ({
      name: String(p.name ?? '').trim() || 'Tanpa Nama',
      url: normUrl(p.url),
      date: String(p.date ?? '').trim(),
      uploader: String(p.uploader ?? '').trim(),
      type: String(p.type ?? '').trim().toLowerCase() || 'photo'
    }))
    .filter((p) => p.url);
}

function dateValue(item) {
  const t = Date.parse(item.date);
  return Number.isFinite(t) ? t : 0;
}

function sortItems(list) {
  return list.slice().sort((a, b) => {
    const d = dateValue(b) - dateValue(a);
    if (d !== 0) return d;
    return a.name.localeCompare(b.name, 'id', { numeric: true });
  });
}

function prettyDate(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return iso || '';
  try {
    return new Date(t).toLocaleDateString('id-ID', {
      day: '2-digit', month: 'short', year: 'numeric'
    });
  } catch {
    return iso;
  }
}

function matches(item) {
  if (filter === 'photo' && isVideo(item)) return false;
  if (filter === 'video' && !isVideo(item)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return item.name.toLowerCase().includes(q) || item.uploader.toLowerCase().includes(q);
}

function cardNode(item) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = './photo/?name=' + encodeURIComponent(item.name);

  const thumb = document.createElement('div');
  thumb.className = 'card-thumb';

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = 'Foto ' + item.name;
  img.referrerPolicy = 'no-referrer';
  img.src = item.url;
  img.addEventListener('load', () => img.classList.add('loaded'));
  img.addEventListener('error', () => {
    img.remove();
    thumb.style.display = 'flex';
    thumb.style.alignItems = 'center';
    thumb.style.justifyContent = 'center';
    thumb.innerHTML =
      '<svg viewBox="0 0 24 24" width="32" height="32" fill="rgba(255,255,255,.28)" aria-hidden="true">' +
      '<path d="M21 5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Zm-2 0H5v14h14V5Z"/></svg>';
  });
  thumb.appendChild(img);

  if (isVideo(item)) {
    const badge = document.createElement('span');
    badge.className = 'card-badge';
    badge.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>VIDEO';
    thumb.appendChild(badge);
  }

  const body = document.createElement('div');
  body.className = 'card-body';

  const name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = '#' + item.name;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = prettyDate(item.date);

  body.append(name, meta);

  if (item.uploader) {
    const up = document.createElement('div');
    up.className = 'card-uploader';
    up.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-8 1.7-8 4v2h16v-2c0-2.3-4.7-4-8-4Z"/></svg>';
    up.append(document.createTextNode(item.uploader));
    body.appendChild(up);
  }

  a.append(thumb, body);
  return a;
}

function render() {
  const list = allItems.filter(matches);
  el.grid.innerHTML = '';

  el.count.textContent = allItems.length
    ? list.length + ' dari ' + allItems.length + ' media'
    : '';

  if (!list.length) {
    el.state.classList.remove('hidden');
    el.retry.classList.add('hidden');
    if (!allItems.length) {
      el.stateTitle.textContent = 'Belum ada media';
      el.stateText.textContent = 'Galeri kelas masih kosong.';
    } else {
      el.stateTitle.textContent = 'Tidak ditemukan';
      el.stateText.textContent = 'Coba kata kunci atau filter lain.';
    }
    return;
  }

  el.state.classList.add('hidden');
  const frag = document.createDocumentFragment();
  list.forEach((item) => frag.appendChild(cardNode(item)));
  el.grid.appendChild(frag);
}

function showLoading() {
  el.grid.innerHTML = '';
  el.state.classList.add('hidden');
  for (let i = 0; i < 6; i++) {
    const box = document.createElement('div');
    box.className = 'card skeleton';
    box.style.aspectRatio = '3 / 4';
    el.grid.appendChild(box);
  }
}

function showError(message) {
  el.grid.innerHTML = '';
  el.count.textContent = '';
  el.state.classList.remove('hidden');
  el.retry.classList.remove('hidden');
  el.stateTitle.textContent = 'Gagal memuat galeri';
  el.stateText.textContent = message || 'Periksa koneksi internet lalu coba lagi.';
}

async function load() {
  showLoading();
  try {
    const res = await fetch(DB_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const items = normalize(data);
    if (!items.length) throw new Error('Data galeri kosong');
    allItems = sortItems(items);
    render();
  } catch (err) {
    showError(
      err && err.message && err.message.indexOf('HTTP') === 0
        ? 'Server galeri tidak merespons (' + err.message + ').'
        : ''
    );
  }
}

el.search.addEventListener('input', (e) => {
  query = e.target.value.trim();
  render();
});

el.chips.forEach((chip) => {
  chip.addEventListener('click', () => {
    filter = chip.dataset.filter;
    el.chips.forEach((c) =>
      c.setAttribute('aria-pressed', String(c === chip))
    );
    render();
  });
});

el.retry.addEventListener('click', load);

load();

/* Service worker: cache aset statis, data tetap network-first */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
