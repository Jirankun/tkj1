<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0B1220" />
        <meta name="description" content="Galeri foto dan video kelas." />
        <meta name="google-adsense-account" content="ca-pub-6754329161781195" />
        <title>Galeri Foto & Video Kelas</title>
        <link rel="stylesheet" href="./assets/theme.css" />
        <link rel="stylesheet" href="./assets/fa/css/all.min.css" />
    </head>
    <body>
        <main class="page">
            <a
                class="dl-banner"
                href="https://github.com/Jirankun/TKJ-One/releases/latest"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="dl-icon" aria-hidden="true">
                    <i class="fa-solid fa-mobile-screen" aria-hidden="true"></i>
                </span>
                <span class="dl-text">
                    <strong>Aplikasi TKJ OnE</strong>
                    <small>Unduh versi terbaru untuk Android</small>
                </span>
                <span class="dl-btn">
                    <i class="fa-solid fa-download" aria-hidden="true"></i>
                    Unduh
                </span>
            </a>

            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input
                    class="search-input"
                    id="searchInput"
                    type="search"
                    inputmode="search"
                    placeholder="Cari foto atau nama uploader"
                    autocomplete="off"
                    aria-label="Cari foto"
                />
            </div>

            <div class="chips" role="group" aria-label="Filter jenis media">
                <button class="chip" type="button" data-filter="all" aria-pressed="true">Semua</button>
                <button class="chip" type="button" data-filter="photo" aria-pressed="false">Foto</button>
                <button class="chip" type="button" data-filter="video" aria-pressed="false">Video</button>
            </div>

            <p class="card-meta" id="countLine" style="margin: 0 0 10px 2px"></p>

            <div class="grid" id="grid" aria-live="polite"></div>

            <div class="state hidden" id="stateBox">
                <script
                    async="async"
                    data-cfasync="false"
                    src="https://pl30270903.profitableratecpmnetwork.com/04f68990e6f339b5dd4731bead5a7f5d/invoke.js"
                ></script>
                <div id="container-04f68990e6f339b5dd4731bead5a7f5d"></div>
                <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                <span class="state-title" id="stateTitle">Gagal memuat galeri</span>
                <span class="state-text" id="stateText">Periksa koneksi internet lalu coba lagi.</span>
                <button class="btn btn-ghost" id="retryBtn" type="button" style="max-width: 220px">Coba Lagi</button>
            </div>
        </main>

        <nav class="tabbar" aria-label="Navigasi utama">
            <a class="tab" href="./index.html" aria-current="page">
                <i class="fa-solid fa-images" aria-hidden="true"></i>
                <span>Galeri</span>
            </a>
            <a class="tab" href="./story/">
                <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
                <span>Cerita</span>
            </a>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script
            async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6754329161781195"
            crossorigin="anonymous"
        ></script>

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-KN1MTKR6YH"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-KN1MTKR6YH");
        </script>

        <script>
            "use strict";

            const DB_URL = "./DB/photos.json";

            const el = {
                grid: document.getElementById("grid"),
                search: document.getElementById("searchInput"),
                chips: Array.from(document.querySelectorAll(".chip")),
                count: document.getElementById("countLine"),
                state: document.getElementById("stateBox"),
                stateTitle: document.getElementById("stateTitle"),
                stateText: document.getElementById("stateText"),
                retry: document.getElementById("retryBtn"),
                toast: document.getElementById("toast"),
            };

            let allItems = [];
            let query = "";
            let filter = "all";
            let toastTimer = null;

            function showToast(msg) {
                if (!el.toast) return;
                el.toast.textContent = msg;
                el.toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.toast.classList.remove("show"), 2200);
            }

            function normUrl(u) {
                return String(u || "")
                    .replace(/\s+/g, "")
                    .trim();
            }

            function isVideo(item) {
                const url = normUrl(item.url);
                return String(item.type || "").toLowerCase() === "video" || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url);
            }

            function normalize(raw) {
                const list = Array.isArray(raw) ? raw : raw && Array.isArray(raw.entries) ? raw.entries : [];
                return list
                    .filter(p => p && typeof p === "object")
                    .map(p => ({
                        name: String(p.name ?? "").trim() || "Tanpa Nama",
                        url: normUrl(p.url),
                        date: String(p.date ?? "").trim(),
                        uploader: String(p.uploader ?? "").trim(),
                        type:
                            String(p.type ?? "")
                                .trim()
                                .toLowerCase() || "photo",
                    }))
                    .filter(p => p.url);
            }

            function dateValue(item) {
                const t = Date.parse(item.date);
                return Number.isFinite(t) ? t : 0;
            }

            function sortItems(list) {
                return list.slice().sort((a, b) => {
                    const d = dateValue(b) - dateValue(a);
                    if (d !== 0) return d;
                    return a.name.localeCompare(b.name, "id", { numeric: true });
                });
            }

            function prettyDate(iso) {
                const t = Date.parse(iso);
                if (!Number.isFinite(t)) return iso || "";
                try {
                    return new Date(t).toLocaleDateString("id-ID", {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                    });
                } catch {
                    return iso;
                }
            }

            function matches(item) {
                if (filter === "photo" && isVideo(item)) return false;
                if (filter === "video" && !isVideo(item)) return false;
                if (!query) return true;
                const q = query.toLowerCase();
                return item.name.toLowerCase().includes(q) || item.uploader.toLowerCase().includes(q);
            }

            function cardNode(item) {
                const a = document.createElement("a");
                a.className = "card";
                a.href = "./photo/?name=" + encodeURIComponent(item.name);

                const thumb = document.createElement("div");
                thumb.className = "card-thumb";

                const img = document.createElement("img");
                img.loading = "lazy";
                img.decoding = "async";
                img.draggable = false;
                img.alt = "Foto " + item.name;
                img.referrerPolicy = "no-referrer";

                let retried = false;
                // Listener dipasang sebelum src supaya event load dari cache tidak terlewat
                // (penyebab kartu kadang kosong walau gambar sebenarnya berhasil dimuat).
                img.addEventListener("load", () => {
                    if (img.naturalWidth > 0) img.classList.add("loaded");
                });
                img.addEventListener("error", () => {
                    if (!retried) {
                        retried = true;
                        img.src = item.url;
                        return;
                    }
                    img.remove();
                    thumb.style.display = "flex";
                    thumb.style.alignItems = "center";
                    thumb.style.justifyContent = "center";
                    thumb.innerHTML = '<i class="fa-solid fa-image" aria-hidden="true"></i>';
                });
                thumb.appendChild(img);
                img.src = item.url;
                if (img.complete && img.naturalWidth > 0) img.classList.add("loaded");

                if (isVideo(item)) {
                    const badge = document.createElement("span");
                    badge.className = "card-badge";
                    badge.innerHTML = '<i class="fa-solid fa-play" aria-hidden="true"></i>VIDEO';
                    thumb.appendChild(badge);
                }

                const body = document.createElement("div");
                body.className = "card-body";

                const name = document.createElement("div");
                name.className = "card-name";
                name.textContent = "#" + item.name;

                const meta = document.createElement("div");
                meta.className = "card-meta";
                meta.textContent = prettyDate(item.date);

                body.append(name, meta);

                if (item.uploader) {
                    const up = document.createElement("div");
                    up.className = "card-uploader";
                    up.innerHTML = '<i class="fa-solid fa-user" aria-hidden="true"></i>';
                    up.append(document.createTextNode(item.uploader));
                    body.appendChild(up);
                }

                a.append(thumb, body);
                return a;
            }

            function render() {
                const list = allItems.filter(matches);
                el.grid.innerHTML = "";

                el.count.textContent = allItems.length ? list.length + " dari " + allItems.length + " media" : "";

                if (!list.length) {
                    el.state.classList.remove("hidden");
                    el.retry.classList.add("hidden");
                    if (!allItems.length) {
                        el.stateTitle.textContent = "Belum ada media";
                        el.stateText.textContent = "Galeri kelas masih kosong.";
                    } else {
                        el.stateTitle.textContent = "Tidak ditemukan";
                        el.stateText.textContent = "Coba kata kunci atau filter lain.";
                    }
                    return;
                }

                el.state.classList.add("hidden");
                const frag = document.createDocumentFragment();
                list.forEach(item => frag.appendChild(cardNode(item)));
                el.grid.appendChild(frag);
            }

            function showLoading() {
                el.grid.innerHTML = "";
                el.state.classList.add("hidden");
                for (let i = 0; i < 6; i++) {
                    const box = document.createElement("div");
                    box.className = "card skeleton";
                    box.style.aspectRatio = "3 / 4";
                    el.grid.appendChild(box);
                }
            }

            function showError(message) {
                el.grid.innerHTML = "";
                el.count.textContent = "";
                el.state.classList.remove("hidden");
                el.retry.classList.remove("hidden");
                el.stateTitle.textContent = "Gagal memuat galeri";
                el.stateText.textContent = message || "Periksa koneksi internet lalu coba lagi.";
            }

            async function load() {
                showLoading();
                try {
                    const res = await fetch(DB_URL + "?t=" + Date.now(), { cache: "no-store" });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const data = await res.json();
                    const items = normalize(data);
                    if (!items.length) throw new Error("Data galeri kosong");
                    allItems = sortItems(items);
                    render();
                } catch (err) {
                    showError(
                        err && err.message && err.message.indexOf("HTTP") === 0
                            ? "Server galeri tidak merespons (" + err.message + ")."
                            : "",
                    );
                }
            }

            el.search.addEventListener("input", e => {
                query = e.target.value.trim();
                render();
            });

            el.chips.forEach(chip => {
                chip.addEventListener("click", () => {
                    filter = chip.dataset.filter;
                    el.chips.forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
                    render();
                });
            });

            el.retry.addEventListener("click", load);

            load();

            /* Service worker: cache aset statis, data tetap network-first */
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("/sw.js").catch(() => {});
                });
            }
        </script>
        <script>
            /* Anti-copy / anti-save: foto hanya bisa diunduh lewat aplikasi. */
            (function () {
                document.addEventListener("contextmenu", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("dragstart", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && (k === "s" || k === "p")) e.preventDefault();
                });
            })();
        </script>
    </body>
</html>
