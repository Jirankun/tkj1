<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#060B14" />
        <meta name="robots" content="noindex" />
        <title>Foto | TKJ OnE</title>
        <link rel="stylesheet" href="../assets/theme.css" />
        <link rel="stylesheet" href="../assets/fa/css/all.min.css" />
        <style>
            html,
            body {
                height: 100%;
                overflow: hidden;
                background: #000;
            }

            .viewer {
                display: flex;
                flex-direction: column;
                height: 100dvh;
                background: var(--bg-deep);
            }

            /* ---------- Bar atas ---------- */
            .topbar {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: calc(var(--safe-top) + 10px) 14px 10px;
                background: var(--bg);
                border-bottom: 1px solid var(--line);
                z-index: 10;
            }

            .topbar .icon-btn {
                width: 38px;
                height: 38px;
                min-width: 38px;
            }

            .topbar .icon-btn i {
                font-size: 18px;
            }

            .top-title {
                flex: 1;
                min-width: 0;
                font-size: 16px;
                font-weight: 800;
                letter-spacing: 0.2px;
                color: var(--text);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .top-counter {
                font-size: 12px;
                font-weight: 700;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }

            /* ---------- Panggung media ---------- */
            .stage {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                background: #000;
            }

            .stage img,
            .stage video {
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
            }

            /* touch-action none: gesture horizontal tidak boleh dibatalkan browser
               (penyebab utama swipe kiri/kanan gagal di beberapa perangkat). */
            .stage img {
                touch-action: none;
                user-select: none;
                -webkit-user-drag: none;
                pointer-events: auto;
            }

            /* ---------- Info bawah (bukan overlay) ---------- */
            .detail {
                flex: 0 0 auto;
                padding: 14px 16px calc(16px + var(--safe-bottom));
                background: var(--bg);
                border-top: 1px solid var(--line);
            }

            .detail-head {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .detail-name {
                flex: 1;
                min-width: 0;
                font-size: 16px;
                font-weight: 800;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .detail-badge {
                flex: 0 0 auto;
                padding: 4px 9px;
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 0.6px;
                color: var(--blue-soft);
                background: rgba(41, 121, 255, 0.14);
                border: 1px solid rgba(41, 121, 255, 0.3);
                border-radius: 999px;
            }

            .detail-row {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-top: 8px;
                font-size: 12.5px;
                color: var(--muted);
                line-height: 1.4;
            }

            .detail-row i {
                width: 14px;
                font-size: 13px;
                color: var(--blue-soft);
                text-align: center;
            }

            .detail-row .uploader {
                font-weight: 700;
                color: var(--blue-soft);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .download-cta {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-top: 14px;
                min-height: 44px;
                padding: 10px 14px;
                font-size: 13px;
                font-weight: 800;
                color: #fff;
                background: linear-gradient(145deg, var(--blue), var(--blue-strong));
                border-radius: 12px;
                box-shadow: 0 6px 18px var(--blue-glow);
            }

            .download-cta i {
                font-size: 15px;
            }

            .detail-note {
                margin-top: 10px;
                font-size: 11px;
                line-height: 1.5;
                color: var(--dim);
            }

            /* ---------- Spinner ---------- */
            .spinner {
                position: absolute;
                width: 34px;
                height: 34px;
                border: 3px solid rgba(255, 255, 255, 0.16);
                border-top-color: var(--blue-soft);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                z-index: 6;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .toast {
                bottom: calc(24px + var(--safe-bottom));
            }
        </style>
    </head>
    <body>
        <div class="viewer">
            <header class="topbar">
                <button class="icon-btn" id="backBtn" type="button" aria-label="Kembali">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                </button>
                <span class="top-title" id="topTitle">TKJ OnE</span>
                <span class="top-counter" id="topCounter"></span>
                <button class="icon-btn" id="shareBtn" type="button" aria-label="Bagikan tautan">
                    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
                </button>
            </header>

            <div class="stage" id="stage">
                <div class="spinner" id="spinner"></div>
            </div>

            <footer class="detail">
                <div class="detail-head">
                    <span class="detail-name" id="detailName">—</span>
                    <span class="detail-badge" id="detailBadge">FOTO</span>
                </div>
                <div class="detail-row">
                    <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                    <span id="detailDate">—</span>
                </div>
                <div class="detail-row hidden" id="uploaderRow">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <span class="uploader" id="detailUploader"></span>
                </div>
                <a
                    class="download-cta"
                    id="downloadCta"
                    href="https://github.com/Jirankun/TKJ-One/releases/latest"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-solid fa-download" aria-hidden="true"></i>
                    Download
                </a>
                <p class="detail-note">Hak cipta konten ini ada pada pengambilnya.</p>
            </footer>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script>
            "use strict";

            const DB_URL = "../DB/photos.json";
            const APP_SCHEME = "tkjone";
            const APP_HOST = "photo";

            const $ = id => document.getElementById(id);
            const stage = $("stage");
            const spinner = $("spinner");
            const toast = $("toast");

            let items = [];
            let index = -1;
            let mediaEl = null;
            let toastTimer = null;
            let swipeStartX = 0;
            let swipeStartY = 0;
            let swipePointerId = null;
            let swipePointerMoved = false;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
            }

            function normUrl(u) {
                return String(u || "")
                    .replace(/\s+/g, "")
                    .trim();
            }

            function isVideo(item) {
                const url = normUrl(item.url);
                return String(item.type || "").toLowerCase() === "video" || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url);
            }

            function normalize(raw) {
                const list = Array.isArray(raw) ? raw : raw && Array.isArray(raw.entries) ? raw.entries : [];
                return list
                    .filter(p => p && typeof p === "object")
                    .map(p => ({
                        name: String(p.name ?? "").trim() || "Tanpa Nama",
                        url: normUrl(p.url),
                        date: String(p.date ?? "").trim(),
                        uploader: String(p.uploader ?? "").trim(),
                        type:
                            String(p.type ?? "")
                                .trim()
                                .toLowerCase() || "photo",
                    }))
                    .filter(p => p.url);
            }

            function prettyDate(iso) {
                const t = Date.parse(iso);
                if (!Number.isFinite(t)) return iso || "—";
                try {
                    return new Date(t).toLocaleDateString("id-ID", {
                        weekday: "long",
                        day: "2-digit",
                        month: "long",
                        year: "numeric",
                    });
                } catch {
                    return iso;
                }
            }

            /* Nama foto bisa datang dari ?name=ID (kanonik) atau /photo/ID (link lama). */
            function requestedName() {
                const params = new URLSearchParams(location.search);
                const direct = (params.get("name") || params.get("id") || "").trim();
                if (direct) return direct;

                const m = location.pathname.match(/\/photo\/([^/]+)\/?$/);
                if (m) {
                    try {
                        return decodeURIComponent(m[1]);
                    } catch {
                        return m[1];
                    }
                }
                return "";
            }

            function shareUrl() {
                return location.origin + "/photo/?name=" + encodeURIComponent(items[index].name);
            }

            function appUri() {
                return APP_SCHEME + "://" + APP_HOST + "/" + encodeURIComponent(items[index].name);
            }

            function clearStage() {
                if (mediaEl) {
                    if (mediaEl.tagName === "VIDEO") {
                        mediaEl.pause();
                        mediaEl.removeAttribute("src");
                        mediaEl.load();
                    }
                    mediaEl.remove();
                    mediaEl = null;
                }
                swipePointerId = null;
                swipePointerMoved = false;
                spinner.classList.remove("hidden");
            }

            function show(i, push) {
                if (i < 0 || i >= items.length) return;
                index = i;
                const item = items[i];
                const video = isVideo(item);
                clearStage();

                if (video) {
                    const v = document.createElement("video");
                    v.src = item.url;
                    v.controls = true;
                    v.setAttribute("controlsList", "nodownload noremoteplayback");
                    v.setAttribute("disablePictureInPicture", "");
                    v.disableRemotePlayback = true;
                    v.playsInline = true;
                    v.preload = "metadata";
                    v.setAttribute("playsinline", "");
                    v.addEventListener("contextmenu", event => event.preventDefault());
                    v.addEventListener("loadeddata", () => spinner.classList.add("hidden"));
                    v.addEventListener("error", () => {
                        spinner.classList.add("hidden");
                        showToast("Video gagal dimuat");
                    });
                    mediaEl = v;
                    stage.insertBefore(v, spinner);
                    v.play().catch(() => {});
                } else {
                    const img = document.createElement("img");
                    img.alt = "Foto " + item.name;
                    img.decoding = "async";
                    img.draggable = false;
                    img.referrerPolicy = "no-referrer";

                    let retried = false;
                    const finishLoading = () => spinner.classList.add("hidden");

                    // Listener dipasang SEBELUM src: kalau gambar sudah ada di cache,
                    // event load bisa selesai sangat cepat dan handler yang dipasang
                    // belakangan akan terlewat (foto tampak tidak muncul).
                    img.addEventListener("load", () => {
                        if (img.naturalWidth > 0) finishLoading();
                    });
                    img.addEventListener("error", () => {
                        if (!retried) {
                            retried = true;
                            img.src = item.url;
                            return;
                        }
                        finishLoading();
                        showToast("Gambar gagal dimuat");
                    });

                    mediaEl = img;
                    stage.insertBefore(img, spinner);
                    img.src = item.url;

                    // Fallback kalau event load sudah lewat sebelum handler terpasang.
                    if (img.complete && img.naturalWidth > 0) finishLoading();
                }

                $("topTitle").textContent = "#" + item.name;
                $("topCounter").textContent = items.length > 1 ? i + 1 + "/" + items.length : "";
                $("detailName").textContent = "#" + item.name;
                $("detailBadge").textContent = video ? "VIDEO" : "FOTO";
                $("detailDate").textContent = prettyDate(item.date);

                const row = $("uploaderRow");
                if (item.uploader) {
                    $("detailUploader").textContent = "Diunggah oleh " + item.uploader;
                    row.classList.remove("hidden");
                } else {
                    row.classList.add("hidden");
                }

                document.title = "TKJ OnE — #" + item.name;

                if (push !== false) {
                    const url = "/photo/?name=" + encodeURIComponent(item.name);
                    if (location.pathname + location.search !== url) {
                        history.replaceState({ name: item.name }, "", url);
                    }
                }
            }

            function step(delta) {
                const next = index + delta;
                if (next < 0 || next >= items.length) {
                    showToast(delta < 0 ? "Ini media pertama" : "Ini media terakhir");
                    return;
                }
                show(next);
            }

            async function boot() {
                try {
                    const res = await fetch(DB_URL + "?t=" + Date.now(), { cache: "no-store" });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    items = normalize(await res.json());
                    if (!items.length) throw new Error("kosong");

                    const name = requestedName();
                    let i = items.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
                    if (i < 0) i = 0;
                    show(i, false);
                } catch (err) {
                    spinner.classList.add("hidden");
                    showToast("Gagal memuat data galeri");
                }
            }

            /* ---------- Interaksi ---------- */
            $("backBtn").addEventListener("click", () => {
                if (history.length > 1) history.back();
                else location.href = "../index.html";
            });

            async function copyShareUrl(url) {
                try {
                    await navigator.clipboard.writeText(url);
                    showToast("Tautan disalin");
                } catch {
                    const ta = document.createElement("textarea");
                    ta.value = url;
                    ta.style.position = "fixed";
                    ta.style.left = "-9999px";
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        if (!document.execCommand("copy")) throw new Error("Clipboard unavailable");
                        showToast("Tautan disalin");
                    } catch {
                        showToast("Gagal membagikan tautan");
                    }
                    ta.remove();
                }
            }

            $("shareBtn").addEventListener("click", async () => {
                if (index < 0) return;
                const url = shareUrl();
                if (navigator.share) {
                    try {
                        await navigator.share({ title: document.title, url });
                        return;
                    } catch (err) {
                        if (err && err.name === "AbortError") return;
                    }
                }
                await copyShareUrl(url);
            });

            /* Download: deteksi aplikasi — ada → buka aplikasi; tidak ada → langsung
   ke halaman rilis APK di GitHub. */
            const RELEASE_URL = "https://github.com/Jirankun/TKJ-One/releases/latest";
            let checkingApp = false;

            function openAppOrRelease() {
                if (index < 0 || checkingApp) return;
                checkingApp = true;

                let appOpened = false;
                const markOpened = () => {
                    appOpened = true;
                };
                document.addEventListener("visibilitychange", markOpened);
                window.addEventListener("blur", markOpened);

                const frame = document.createElement("iframe");
                frame.style.display = "none";
                frame.src = appUri();
                document.body.appendChild(frame);

                setTimeout(() => {
                    document.removeEventListener("visibilitychange", markOpened);
                    window.removeEventListener("blur", markOpened);
                    frame.remove();
                    checkingApp = false;
                    if (appOpened) {
                        showToast("Membuka TKJ OnE");
                    } else {
                        // Aplikasi tidak terbuka → langsung ke rilis terbaru
                        window.location.href = RELEASE_URL;
                    }
                }, 1300);
            }

            $("downloadCta").addEventListener("click", e => {
                e.preventDefault();
                openAppOrRelease();
            });

            document.addEventListener("keydown", e => {
                if (e.key === "ArrowLeft") step(-1);
                else if (e.key === "ArrowRight") step(1);
                else if (e.key === "Escape") location.href = "../index.html";
            });

            function beginSwipe(target, x, y) {
                // Jangan mulai swipe dari tombol/link (mis. tombol download).
                if (!mediaEl || mediaEl.tagName !== "IMG") return false;
                if (target && target.closest && target.closest("a,button")) return false;
                swipeStartX = x;
                swipeStartY = y;
                swipePointerMoved = false;
                return true;
            }

            function endSwipe(x, y) {
                const dx = x - swipeStartX;
                const dy = y - swipeStartY;
                const threshold = Math.min(72, Math.max(44, window.innerWidth * 0.12));
                const shouldStep = swipePointerMoved && Math.abs(dx) >= threshold && Math.abs(dx) > Math.abs(dy) * 1.25;
                swipePointerMoved = false;
                if (shouldStep) step(dx < 0 ? 1 : -1);
            }

            if (window.PointerEvent) {
                stage.addEventListener("pointerdown", event => {
                    if (event.pointerType === "mouse" && event.button !== 0) return;
                    if (!beginSwipe(event.target, event.clientX, event.clientY)) return;
                    swipePointerId = event.pointerId;
                    try {
                        event.target.setPointerCapture(event.pointerId);
                    } catch (_error) {}
                });

                stage.addEventListener("pointermove", event => {
                    if (event.pointerId !== swipePointerId) return;
                    const dx = event.clientX - swipeStartX;
                    const dy = event.clientY - swipeStartY;
                    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) swipePointerMoved = true;
                });

                stage.addEventListener("pointerup", event => {
                    if (event.pointerId !== swipePointerId) return;
                    swipePointerId = null;
                    endSwipe(event.clientX, event.clientY);
                });

                stage.addEventListener("pointercancel", () => {
                    swipePointerId = null;
                    swipePointerMoved = false;
                });
            } else {
                stage.addEventListener(
                    "touchstart",
                    event => {
                        if (event.touches.length !== 1) return;
                        const touch = event.touches[0];
                        beginSwipe(event.target, touch.clientX, touch.clientY);
                    },
                    { passive: true },
                );

                stage.addEventListener(
                    "touchmove",
                    event => {
                        if (event.touches.length !== 1 || !mediaEl) return;
                        const touch = event.touches[0];
                        const dx = touch.clientX - swipeStartX;
                        const dy = touch.clientY - swipeStartY;
                        if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) swipePointerMoved = true;
                    },
                    { passive: true },
                );

                stage.addEventListener(
                    "touchend",
                    event => {
                        const touch = event.changedTouches[0];
                        if (touch) endSwipe(touch.clientX, touch.clientY);
                    },
                    { passive: true },
                );
                stage.addEventListener(
                    "touchcancel",
                    () => {
                        swipePointerMoved = false;
                    },
                    { passive: true },
                );
            }

            window.addEventListener("popstate", () => {
                const name = requestedName();
                const i = items.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
                if (i >= 0) show(i, false);
            });

            boot();
        </script>
        <script>
            /* Anti-copy / anti-save: foto hanya bisa diunduh lewat aplikasi. */
            (function () {
                document.addEventListener("contextmenu", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("dragstart", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && (k === "s" || k === "p")) e.preventDefault();
                });
            })();
        </script>
    </body>
</html>
