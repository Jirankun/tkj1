<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.8" />
        <link rel="icon" type="image/png" href="../assets/ic.webp" />
        <meta name="theme-color" content="#060B14" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Foto | TKJ OnE</title>
        <link rel="stylesheet" href="../code/css/gallery/theme.css" />
        <link rel="stylesheet" href="../assets/fa/css/all.min.css" />
        <link rel="stylesheet" href="../assets/plyr/plyr.css" />
        <link rel="stylesheet" href="../code/css/gallery/photo.css" />
    </head>
    <body>
        <div class="viewer">
            <header class="topbar">
                <button class="icon-btn" id="backBtn" type="button" aria-label="Kembali">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                </button>
                <span class="top-title" id="topTitle">TKJ OnE</span>
                <span class="top-counter" id="topCounter"></span>
                <button class="icon-btn" id="shareBtn" type="button" aria-label="Bagikan tautan">
                    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
                </button>
            </header>

            <div class="stage" id="stage">
                <div class="spinner" id="spinner"></div>
                <div class="stage-msg hidden" id="stageMsg">
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                    <span id="stageMsgText">Gambar gagal dimuat</span>
                </div>
            </div>

            <footer class="detail">
                <div class="detail-head">
                    <span class="detail-name" id="detailName">—</span>
                    <span class="detail-badge" id="detailBadge">FOTO</span>
                </div>
                <div class="detail-row">
                    <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                    <span id="detailDate">—</span>
                </div>
                <div class="detail-row hidden" id="uploaderRow">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <span class="uploader" id="detailUploader"></span>
                </div>
                <a
                    class="download-cta"
                    id="downloadCta"
                    href="https://github.com/Jirankun/TKJ-One/releases/latest"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-solid fa-download" aria-hidden="true"></i>
                    Download
                </a>
                <p class="detail-note">Hak cipta konten ini ada pada pengambilnya.</p>
            </footer>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script src="../assets/plyr/plyr.js"></script>
        <script src="../code/js/gallery/photo.js"></script>
        <script src="../code/js/gallery/anti-copy.js"></script>
    </body>
</html>
