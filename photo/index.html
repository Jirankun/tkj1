<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060B14" />
<meta name="robots" content="noindex" />
<title>Foto — TKJ OnE</title>
<link rel="stylesheet" href="../assets/theme.css" />
<style>
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .viewer {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--bg-deep);
  }

  /* ---------- Bar atas ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }

  .topbar .icon-btn {
    width: 38px;
    height: 38px;
    min-width: 38px;
  }

  .topbar .icon-btn svg {
    width: 19px;
    height: 19px;
  }

  .top-title {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.2px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .top-counter {
    font-size: 12px;
    font-weight: 700;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Panggung media ---------- */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  .stage img,
  .stage video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  .nav-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 34%;
    z-index: 5;
    border: 0;
    background: transparent;
  }

  .nav-zone.prev { left: 0; }
  .nav-zone.next { right: 0; }

  /* ---------- Info bawah (bukan overlay) ---------- */
  .detail {
    flex: 0 0 auto;
    padding: 14px 16px calc(16px + var(--safe-bottom));
    background: var(--bg);
    border-top: 1px solid var(--line);
  }

  .detail-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .detail-name {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .detail-badge {
    flex: 0 0 auto;
    padding: 4px 9px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: var(--blue-soft);
    background: rgba(41, 121, 255, 0.14);
    border: 1px solid rgba(41, 121, 255, 0.3);
    border-radius: 999px;
  }

  .detail-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  .detail-row svg {
    width: 14px;
    height: 14px;
    min-width: 14px;
    fill: var(--blue-soft);
  }

  .detail-row .uploader {
    font-weight: 700;
    color: var(--blue-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .detail-note {
    margin-top: 10px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--dim);
  }

  /* ---------- Spinner ---------- */
  .spinner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255, 255, 255, 0.16);
    border-top-color: var(--blue-soft);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    z-index: 6;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .toast {
    bottom: calc(24px + var(--safe-bottom));
  }
</style>
</head>
<body>

<div class="viewer">

  <header class="topbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Kembali">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
    </button>
    <span class="top-title" id="topTitle">TKJ OnE</span>
    <span class="top-counter" id="topCounter"></span>
    <button class="icon-btn" id="copyBtn" type="button" aria-label="Salin tautan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>
    </button>
    <button class="icon-btn" id="appBtn" type="button" aria-label="Buka di aplikasi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1H7a3 3 0 0 0-3 3v16a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V4a3 3 0 0 0-3-3Zm1 17H6V5h12v13Zm-6 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>
    </button>
  </header>

  <div class="stage" id="stage">
    <div class="spinner" id="spinner"></div>
    <button class="nav-zone prev" id="zonePrev" type="button" aria-label="Sebelumnya"></button>
    <button class="nav-zone next" id="zoneNext" type="button" aria-label="Berikutnya"></button>
  </div>

  <footer class="detail">
    <div class="detail-head">
      <span class="detail-name" id="detailName">—</span>
      <span class="detail-badge" id="detailBadge">FOTO</span>
    </div>
    <div class="detail-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 16H5V10h14v10Z"/></svg>
      <span id="detailDate">—</span>
    </div>
    <div class="detail-row hidden" id="uploaderRow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-8 1.7-8 4v2h16v-2c0-2.3-4.7-4-8-4Z"/></svg>
      <span class="uploader" id="detailUploader"></span>
    </div>
    <p class="detail-note">Hak cipta konten ini ada pada pengambilnya.</p>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const DB_URL = '../DB/photos.json';
const APP_SCHEME = 'tkjone';
const APP_HOST = 'photo';

const $ = (id) => document.getElementById(id);
const stage = $('stage');
const spinner = $('spinner');
const toast = $('toast');

let items = [];
let index = -1;
let mediaEl = null;
let toastTimer = null;
let touchStartX = 0;
let touchStartY = 0;
let swiping = false;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function normUrl(u) {
  return String(u || '').replace(/\s+/g, '').trim();
}

function isVideo(item) {
  const url = normUrl(item.url);
  return String(item.type || '').toLowerCase() === 'video' ||
    /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url);
}

function normalize(raw) {
  const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.entries) ? raw.entries : []);
  return list
    .filter((p) => p && typeof p === 'object')
    .map((p) => ({
      name: String(p.name ?? '').trim() || 'Tanpa Nama',
      url: normUrl(p.url),
      date: String(p.date ?? '').trim(),
      uploader: String(p.uploader ?? '').trim(),
      type: String(p.type ?? '').trim().toLowerCase() || 'photo'
    }))
    .filter((p) => p.url);
}

function prettyDate(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return iso || '—';
  try {
    return new Date(t).toLocaleDateString('id-ID', {
      weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    });
  } catch {
    return iso;
  }
}

/* Nama foto bisa datang dari ?name=ID (kanonik) atau /photo/ID (link lama). */
function requestedName() {
  const params = new URLSearchParams(location.search);
  const direct = (params.get('name') || params.get('id') || '').trim();
  if (direct) return direct;

  const m = location.pathname.match(/\/photo\/([^/]+)\/?$/);
  if (m) {
    try { return decodeURIComponent(m[1]); } catch { return m[1]; }
  }
  return '';
}

function shareUrl() {
  return location.origin + '/photo/?name=' + encodeURIComponent(items[index].name);
}

function appUri() {
  return APP_SCHEME + '://' + APP_HOST + '/' + encodeURIComponent(items[index].name);
}

function clearStage() {
  if (mediaEl) {
    if (mediaEl.tagName === 'VIDEO') {
      mediaEl.pause();
      mediaEl.removeAttribute('src');
      mediaEl.load();
    }
    mediaEl.remove();
    mediaEl = null;
  }
  spinner.classList.remove('hidden');
}

function show(i, push) {
  if (i < 0 || i >= items.length) return;
  index = i;
  const item = items[i];
  const video = isVideo(item);
  clearStage();

  if (video) {
    const v = document.createElement('video');
    v.src = item.url;
    v.controls = true;
    v.playsInline = true;
    v.preload = 'metadata';
    v.setAttribute('playsinline', '');
    v.addEventListener('loadeddata', () => spinner.classList.add('hidden'));
    v.addEventListener('error', () => {
      spinner.classList.add('hidden');
      showToast('Video gagal dimuat');
    });
    mediaEl = v;
    stage.insertBefore(v, spinner);
    v.play().catch(() => {});
  } else {
    const img = document.createElement('img');
    img.alt = 'Foto ' + item.name;
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.addEventListener('load', () => spinner.classList.add('hidden'));
    img.addEventListener('error', () => {
      spinner.classList.add('hidden');
      showToast('Gambar gagal dimuat');
    });
    img.src = item.url;
    mediaEl = img;
    stage.insertBefore(img, spinner);
  }

  $('topTitle').textContent = '#' + item.name;
  $('topCounter').textContent = items.length > 1 ? (i + 1) + '/' + items.length : '';
  $('detailName').textContent = '#' + item.name;
  $('detailBadge').textContent = video ? 'VIDEO' : 'FOTO';
  $('detailDate').textContent = prettyDate(item.date);

  const row = $('uploaderRow');
  if (item.uploader) {
    $('detailUploader').textContent = 'Diunggah oleh ' + item.uploader;
    row.classList.remove('hidden');
  } else {
    row.classList.add('hidden');
  }

  document.title = 'TKJ OnE — #' + item.name;

  if (push !== false) {
    const url = '/photo/?name=' + encodeURIComponent(item.name);
    if (location.pathname + location.search !== url) {
      history.replaceState({ name: item.name }, '', url);
    }
  }
}

function step(delta) {
  const next = index + delta;
  if (next < 0 || next >= items.length) {
    showToast(delta < 0 ? 'Ini media pertama' : 'Ini media terakhir');
    return;
  }
  show(next);
}

async function boot() {
  try {
    const res = await fetch(DB_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    items = normalize(await res.json());
    if (!items.length) throw new Error('kosong');

    const name = requestedName();
    let i = items.findIndex((p) => p.name.toLowerCase() === name.toLowerCase());
    if (i < 0) i = 0;
    show(i, false);
  } catch (err) {
    spinner.classList.add('hidden');
    showToast('Gagal memuat data galeri');
  }
}

/* ---------- Interaksi ---------- */
$('backBtn').addEventListener('click', () => {
  if (history.length > 1) history.back();
  else location.href = '../index.html';
});

$('copyBtn').addEventListener('click', async () => {
  if (index < 0) return;
  const url = shareUrl();
  try {
    await navigator.clipboard.writeText(url);
    showToast('Tautan disalin');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('Tautan disalin');
    } catch {
      showToast('Gagal menyalin tautan');
    }
    ta.remove();
  }
});

$('appBtn').addEventListener('click', () => {
  if (index < 0) return;
  const uri = appUri();
  const frame = document.createElement('iframe');
  frame.style.display = 'none';
  frame.src = uri;
  document.body.appendChild(frame);
  setTimeout(() => {
    frame.remove();
    showToast('Membuka TKJ OnE');
  }, 900);
});

$('zonePrev').addEventListener('click', () => step(-1));
$('zoneNext').addEventListener('click', () => step(1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') location.href = '../index.html';
});

stage.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swiping = false;
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) swiping = true;
}, { passive: true });

stage.addEventListener('touchend', (e) => {
  if (!swiping) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const threshold = Math.min(70, Math.max(40, window.innerWidth * 0.12));
  if (Math.abs(dx) > threshold) step(dx < 0 ? 1 : -1);
  swiping = false;
});

window.addEventListener('popstate', () => {
  const name = requestedName();
  const i = items.findIndex((p) => p.name.toLowerCase() === name.toLowerCase());
  if (i >= 0) show(i, false);
});

boot();
</script>
</body>
</html>
