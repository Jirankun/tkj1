<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.8" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" type="image/png" href="./assets/ic.png" />
        <title>Uploader | TKJ OnE</title>
        <link rel="stylesheet" href="../assets/plyr/plyr.css" />
        <style>
            :root {
                --bg: #0a0a0f;
                --surface: #12121a;
                --surface-2: #181822;
                --border: #22222e;
                --blue: #3b82f6;
                --blue-bright: #60a5fa;
                --blue-glow: rgba(59, 130, 246, 0.2);
                --white: #f1f5f9;
                --dim: #94a3b8;
                --faint: #475569;
                --green: #22c55e;
                --red: #f87171;
                --radius: 14px;
                --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: var(--bg);
                color: var(--white);
                font-family: var(--font);
                -webkit-font-smoothing: antialiased;
            }
            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 1rem 1.25rem 6rem;
            }
            .wrap {
                width: 100%;
                max-width: 720px;
            }
            .hidden {
                display: none !important;
            }

            /* ── TABS ── */
            .tabs {
                position: sticky;
                top: 0;
                z-index: 40;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px;
                padding: 4px;
                margin-bottom: 1.1rem;
                background: rgba(18, 18, 26, 0.94);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid var(--border);
                border-radius: 12px;
            }
            .tab-btn {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--dim);
                font-family: inherit;
                font-size: 0.86rem;
                font-weight: 600;
                padding: 0.6rem 0.5rem;
                border-radius: 9px;
                cursor: pointer;
                transition:
                    background 0.2s,
                    color 0.2s;
            }
            .tab-btn:hover {
                color: var(--white);
            }
            .tab-btn.is-active {
                color: var(--blue-bright);
                background: rgba(59, 130, 246, 0.16);
                box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.28);
            }

            /* ── TOTAL PILL (kanan bawah) ── */
            .total-pill {
                position: fixed;
                right: 1rem;
                bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
                z-index: 60;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 0.1rem;
                padding: 0.7rem 0.95rem;
                background: rgba(18, 18, 26, 0.94);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid var(--border);
                border-radius: 14px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                pointer-events: none;
                opacity: 0;
                transform: translateY(10px);
                transition:
                    opacity 0.35s ease,
                    transform 0.35s ease;
            }
            .total-pill.show {
                opacity: 1;
                transform: translateY(0);
            }
            .pill-label {
                font-size: 0.58rem;
                text-transform: uppercase;
                letter-spacing: 0.13em;
                color: var(--faint);
                font-weight: 700;
            }
            .pill-value {
                font-size: 1.02rem;
                font-weight: 700;
                color: var(--white);
                line-height: 1.2;
            }
            .pill-value strong {
                color: var(--blue-bright);
                font-variant-numeric: tabular-nums;
            }
            .pill-sub {
                font-size: 0.7rem;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }

            /* ── STAT CARDS ── */
            .stat-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0.55rem;
                margin-bottom: 1.1rem;
            }
            .stat-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 0.8rem 0.5rem;
                text-align: center;
            }
            .stat-value {
                font-size: 1.15rem;
                font-weight: 700;
                color: var(--white);
                font-variant-numeric: tabular-nums;
                line-height: 1.2;
            }
            .stat-label {
                margin-top: 0.2rem;
                font-size: 0.62rem;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--faint);
                font-weight: 600;
            }
            .stat-card.is-active .stat-value {
                color: var(--green);
            }
            .stat-card.is-suspend .stat-value {
                color: var(--red);
            }

            /* ── CHART ── */
            .chart {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 1.1rem 1.4rem 1.3rem;
            }
            .chart-head {
                display: flex;
                justify-content: space-between;
                padding: 0 0.2rem 0.9rem;
                margin-bottom: 0.4rem;
                border-bottom: 1px solid var(--border);
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: var(--faint);
                font-weight: 500;
            }
            .chart-rows {
                display: flex;
                flex-direction: column;
            }
            .chart-row {
                padding: 0.95rem 0.2rem 0.75rem;
                border-radius: 8px;
                border-bottom: 1px solid var(--border);
                transition: background 0.2s;
            }
            .chart-row:last-child {
                border-bottom: none;
            }
            .chart-row.user-row {
                cursor: pointer;
                padding-left: 0.6rem;
                padding-right: 0.6rem;
                margin: 0 -0.6rem;
            }
            .chart-row.user-row:hover {
                background: var(--surface-2);
            }

            .row-head {
                display: flex;
                align-items: center;
                gap: 0.7rem;
                margin-bottom: 0.6rem;
            }
            .row-avatar {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                object-fit: cover;
                background: var(--surface-2);
                flex-shrink: 0;
                border: 2px solid var(--border);
            }
            .row-avatar.fallback {
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--faint);
                font-size: 1rem;
                font-weight: 600;
            }
            .row-info {
                flex: 1;
                min-width: 0;
            }
            .row-name {
                display: block;
                font-size: 0.92rem;
                font-weight: 500;
                color: var(--white);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .row-sub {
                display: block;
                font-size: 0.72rem;
                color: var(--faint);
                margin-top: 0.1rem;
                font-variant-numeric: tabular-nums;
            }
            .row-sub .row-pct-inline {
                color: var(--blue);
                font-weight: 500;
            }
            /* Rincian jumlah video per user (hanya tampil bila ada video). */
            .row-media {
                display: block;
                font-size: 0.66rem;
                color: var(--faint);
                margin-top: 0.05rem;
                font-variant-numeric: tabular-nums;
            }
            /* Angka (jumlah & persentase) di ujung KANAN baris, rata kanan,
               lebar tetap supaya semua baris sejajar. */
            .row-value {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 0.05rem;
                flex-shrink: 0;
                min-width: 3.4rem;
                padding-left: 0.75rem;
                text-align: right;
            }
            /* Di baris uploader, nama tidak mau merebut ruang: sisanya didorong
               ke ujung kanan (setelah badge & chevron). */
            .chart-row.user-row .row-info {
                flex: 0 1 auto;
            }
            .chart-row.user-row .row-value {
                margin-left: auto;
            }
            .row-count {
                font-size: 1.05rem;
                font-weight: 700;
                color: var(--white);
                font-variant-numeric: tabular-nums;
                line-height: 1.15;
            }
            .row-pct {
                font-size: 0.68rem;
                font-weight: 500;
                color: var(--blue);
                font-variant-numeric: tabular-nums;
                line-height: 1.2;
            }
            .row-caret {
                flex-shrink: 0;
                color: var(--faint);
                font-size: 1.05rem;
                line-height: 1;
                transition:
                    color 0.15s,
                    transform 0.15s;
            }
            .chart-row.user-row:hover .row-caret {
                color: var(--blue);
                transform: translateX(2px);
            }
            .row-bar {
                height: 7px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 999px;
                overflow: hidden;
            }
            .row-bar-fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, var(--blue), var(--blue-bright));
                border-radius: 999px;
                transition: width 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            }

            /* ── BADGE STATUS ── */
            .user-badge {
                flex-shrink: 0;
                padding: 0.16rem 0.5rem;
                border-radius: 999px;
                font-size: 0.6rem;
                font-weight: 700;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                white-space: nowrap;
            }
            .user-badge.is-active {
                color: #86efac;
                background: rgba(34, 197, 94, 0.12);
                border: 1px solid rgba(34, 197, 94, 0.3);
            }
            .user-badge.is-suspend {
                color: #fca5a5;
                background: rgba(248, 113, 113, 0.12);
                border: 1px solid rgba(248, 113, 113, 0.3);
            }
            .user-badge.is-unreg {
                color: var(--dim);
                background: var(--surface-2);
                border: 1px solid var(--border);
            }

            /* ── DAFTAR USER ── */
            .user-group {
                margin-bottom: 1.4rem;
            }
            .user-group-head {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.6rem;
                padding: 0 0.2rem;
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: var(--faint);
                font-weight: 600;
            }
            .group-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .group-dot.is-active {
                background: var(--green);
                box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            }
            .group-dot.is-suspend {
                background: var(--red);
                box-shadow: 0 0 8px rgba(248, 113, 113, 0.5);
            }
            .group-dot.is-unreg {
                background: var(--faint);
            }
            .group-count {
                padding: 0.1rem 0.45rem;
                border-radius: 999px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                font-size: 0.66rem;
                color: var(--dim);
                letter-spacing: 0;
            }

            .user-item {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                margin-bottom: 0.5rem;
                overflow: hidden;
                transition: border-color 0.2s ease;
            }
            .user-item.open {
                border-color: rgba(59, 130, 246, 0.35);
            }
            .user-row {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                padding: 0.8rem 0.9rem;
                background: transparent;
                border: 0;
                color: inherit;
                font-family: inherit;
                text-align: left;
                cursor: pointer;
                transition: background 0.15s;
            }
            .user-row-main {
                display: flex;
                align-items: center;
                gap: 0.7rem;
                width: 100%;
                min-width: 0;
            }
            /* Progress bar porsi foto per user */
            .user-bar {
                display: block;
                height: 6px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 999px;
                overflow: hidden;
            }
            .user-bar-fill {
                display: block;
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, var(--blue), var(--blue-bright));
                border-radius: 999px;
                transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            }
            .user-row:hover {
                background: var(--surface-2);
            }
            .user-caret {
                flex-shrink: 0;
                color: var(--faint);
                font-size: 1.05rem;
                line-height: 1;
                transition:
                    color 0.2s,
                    transform 0.25s;
            }
            .user-item.open .user-caret {
                transform: rotate(90deg);
                color: var(--blue);
            }
            .user-reason {
                margin: 0 0.9rem 0.75rem;
                padding: 0.5rem 0.65rem;
                border-radius: 8px;
                background: rgba(248, 113, 113, 0.08);
                border: 1px solid rgba(248, 113, 113, 0.22);
                color: #fca5a5;
                font-size: 0.72rem;
                line-height: 1.45;
            }

            .user-expand {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .user-item.open .user-expand {
                grid-template-rows: 1fr;
            }
            .user-expand-inner {
                min-height: 0;
                overflow: hidden;
                background: var(--surface-2);
            }
            .user-photos {
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
                padding: 0.5rem;
            }
            .user-empty {
                padding: 0.95rem;
                text-align: center;
                font-size: 0.76rem;
                color: var(--faint);
            }

            .up-item {
                border-radius: 9px;
                overflow: hidden;
            }
            .up-row {
                display: flex;
                align-items: center;
                gap: 0.65rem;
                width: 100%;
                padding: 0.45rem 0.55rem;
                border-radius: 9px;
                background: var(--surface);
                border: 1px solid var(--border);
                color: inherit;
                font: inherit;
                text-align: left;
                text-decoration: none;
                cursor: pointer;
                transition:
                    border-color 0.2s,
                    background 0.2s;
            }
            .up-row:hover {
                border-color: rgba(59, 130, 246, 0.4);
                background: var(--surface-2);
            }
            .up-item.open > .up-row {
                border-color: rgba(59, 130, 246, 0.55);
                background: var(--surface-2);
            }
            .up-caret {
                flex-shrink: 0;
                color: var(--faint);
                font-size: 0.95rem;
                line-height: 1;
                transition:
                    color 0.2s,
                    transform 0.25s;
            }
            .up-item.open .up-caret {
                color: var(--blue);
                transform: rotate(90deg);
            }
            /* Expand di dalam expand: pratinjau muncul di bawah barisnya. */
            .up-view {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .up-item.open .up-view {
                grid-template-rows: 1fr;
            }
            .up-view-inner {
                min-height: 0;
                overflow: hidden;
            }
            .up-full {
                display: block;
                width: 100%;
                min-height: 140px;
                max-height: 58vh;
                object-fit: contain;
                background: #000;
                border-top: 1px solid var(--border);
                border-bottom: 1px solid var(--border);
            }
            /* Player video (Plyr, self-hosted) */
            .up-view .plyr {
                width: 100%;
                max-height: 58vh;
                background: #000;
                border-top: 1px solid var(--border);
                border-bottom: 1px solid var(--border);
                --plyr-color-main: var(--blue);
                --plyr-video-background: #000;
            }
            .up-view .plyr__video-wrapper {
                width: 100%;
                max-height: 58vh;
                background: #000;
            }
            .up-view .plyr video {
                max-height: 58vh;
                object-fit: contain;
            }
            .up-view-actions {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.5rem;
                padding: 0.45rem 0.55rem 0.55rem;
            }
            .up-link {
                font-size: 0.72rem;
                font-weight: 600;
                color: var(--blue-bright);
                text-decoration: none;
            }
            .up-link:active {
                color: var(--white);
            }
            .up-thumb {
                width: 42px;
                height: 42px;
                border-radius: 8px;
                overflow: hidden;
                background: var(--surface-2);
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .up-thumb img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .up-video {
                font-size: 0.58rem;
                font-weight: 700;
                color: var(--blue-bright);
                letter-spacing: 0.04em;
            }
            .up-info {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 0.1rem;
            }
            .up-name {
                display: block;
                font-size: 0.82rem;
                color: var(--white);
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .up-date {
                display: block;
                font-size: 0.7rem;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }

            /* ── STATE ── */
            .state-msg {
                text-align: center;
                padding: 3rem 1rem;
                color: var(--dim);
                font-size: 0.9rem;
            }
            .spinner {
                width: 26px;
                height: 26px;
                border: 3px solid var(--border);
                border-top-color: var(--blue);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
                margin: 0 auto 1rem;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .total-pill,
                .user-expand,
                .row-bar-fill {
                    transition: none !important;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 0.75rem 0.9rem 5.5rem;
                }
                .stat-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
                .chart {
                    padding: 0.9rem 1rem;
                }
                .row-avatar {
                    width: 34px;
                    height: 34px;
                }
                .total-pill {
                    right: 0.75rem;
                    bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <nav class="tabs" role="tablist" aria-label="Tampilan data uploader">
                <button
                    class="tab-btn is-active"
                    type="button"
                    role="tab"
                    id="tabStats"
                    aria-controls="panelStats"
                    aria-selected="true"
                    data-tab="stats"
                >
                    Statistik
                </button>
                <button
                    class="tab-btn"
                    type="button"
                    role="tab"
                    id="tabDetail"
                    aria-controls="panelDetail"
                    aria-selected="false"
                    data-tab="detail"
                >
                    Detail User
                </button>
            </nav>

            <section class="tab-panel" id="panelStats" role="tabpanel" aria-labelledby="tabStats"></section>
            <section class="tab-panel hidden" id="panelDetail" role="tabpanel" aria-labelledby="tabDetail"></section>
        </div>

        <aside class="total-pill" id="totalPill" aria-live="polite">
            <span class="pill-label">Total</span>
            <span class="pill-value"><strong id="pillMedia">—</strong> media</span>
            <span class="pill-sub" id="pillBreakdown">— video · — foto</span>
            <span class="pill-sub" id="pillUsers">— user</span>
        </aside>

        <script src="../assets/plyr/plyr.js"></script>
        <script>
            (function () {
                "use strict";
                const PHOTOS_URL = "../DB/photos.json";
                const STATUS_URL = "../DB/status.json";
                const PANEL_STATS = document.getElementById("panelStats");
                const PANEL_DETAIL = document.getElementById("panelDetail");
                const PILL = document.getElementById("totalPill");
                const PILL_MEDIA = document.getElementById("pillMedia");
                const PILL_BREAKDOWN = document.getElementById("pillBreakdown");
                const PILL_USERS = document.getElementById("pillUsers");

                let ALL_PHOTOS = [];
                let USERS = [];
                let TOTAL_COUNT = 0;

                function esc(s) {
                    const d = document.createElement("div");
                    d.appendChild(document.createTextNode(String(s)));
                    return d.innerHTML;
                }
                function animateNumber(el, target, duration = 1000) {
                    const start = performance.now();
                    function tick(now) {
                        const p = Math.min((now - start) / duration, 1);
                        const eased = 1 - Math.pow(1 - p, 3);
                        el.textContent = Math.round(target * eased);
                        if (p < 1) requestAnimationFrame(tick);
                        else el.textContent = target;
                    }
                    requestAnimationFrame(tick);
                }
                function animatePercent(el, target, duration = 1000) {
                    const start = performance.now();
                    function tick(now) {
                        const p = Math.min((now - start) / duration, 1);
                        const eased = 1 - Math.pow(1 - p, 3);
                        el.textContent = (target * eased).toFixed(1) + "%";
                        if (p < 1) requestAnimationFrame(tick);
                        else el.textContent = target.toFixed(1) + "%";
                    }
                    requestAnimationFrame(tick);
                }
                function getField(obj, keys) {
                    for (let i = 0; i < keys.length; i++) {
                        const v = obj[keys[i]];
                        if (v !== undefined && v !== null && v !== "") return v;
                    }
                    return "";
                }
                function formatDate(d) {
                    if (!d) return "—";
                    let dt;
                    if (typeof d === "number") {
                        dt = new Date(d < 1e12 ? d * 1000 : d);
                    } else {
                        dt = new Date(d);
                    }
                    if (!isNaN(dt.getTime()) && dt.getFullYear() > 1970) {
                        try {
                            return dt.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
                        } catch (e) {
                            return String(d);
                        }
                    }
                    return String(d);
                }

                /* status.json: true = aktif, false = suspend */
                function isSuspended(u) {
                    const s = u && u.status;
                    if (s === undefined || s === null) return false;
                    if (typeof s === "boolean") return !s;
                    const v = String(s).trim().toLowerCase();
                    return v === "false" || v === "0" || v === "no" || v === "suspend" || v === "suspended";
                }

                /* ── Data: user (aktif & suspend) + fotonya ── */
                function buildUsers(photos, status) {
                    const map = {};
                    const users = (status && status.users) || (Array.isArray(status) ? status : []);
                    users.forEach(u => {
                        const n = (u.name || "").trim();
                        if (n) map[n.toLowerCase()] = u;
                    });

                    const byUploader = {};
                    photos.forEach(p => {
                        const orig = (p.uploader || "Tidak diketahui").trim();
                        const key = orig.toLowerCase();
                        if (!byUploader[key]) byUploader[key] = [];
                        byUploader[key].push(p);
                    });

                    const list = [];
                    Object.keys(map).forEach(key => {
                        const u = map[key];
                        const name = (u.name || "").trim();
                        if (!name) return;
                        list.push({
                            key: key,
                            name: name,
                            suspended: isSuspended(u),
                            unregistered: false,
                            reason: (u.suspend_reason || "").trim(),
                            profile: u.profile || u.avatar || u.photo || u.image || "",
                            photos: byUploader[key] || [],
                        });
                    });

                    // Pengunggah yang tidak terdaftar di status.json — tetap ditampilkan agar data tidak hilang.
                    Object.keys(byUploader).forEach(key => {
                        if (map[key]) return;
                        const arr = byUploader[key];
                        list.push({
                            key: key,
                            name: (arr[0].uploader || "Tidak diketahui").trim(),
                            suspended: false,
                            unregistered: true,
                            reason: "",
                            profile: "",
                            photos: arr,
                        });
                    });

                    list.sort((a, b) => b.photos.length - a.photos.length || a.name.localeCompare(b.name, "id"));
                    return list;
                }

                /* ── Helper foto ── */
                function photoName(p, i) {
                    return (
                        getField(p, ["name", "title", "filename", "file", "photo", "caption", "fileName"]) ||
                        `Foto ${i + 1}`
                    );
                }
                function photoDate(p) {
                    return formatDate(
                        getField(p, [
                            "date",
                            "timestamp",
                            "created_at",
                            "time",
                            "uploaded_at",
                            "createdAt",
                            "uploadDate",
                        ]),
                    );
                }
                function photoUrl(p) {
                    const raw = getField(p, [
                        "url",
                        "src",
                        "image",
                        "link",
                        "path",
                        "file_url",
                        "photoUrl",
                        "imageUrl",
                        "download_url",
                    ]);
                    return normalizeMediaUrl(raw);
                }
                /* i.ibb.co (tanpa .com) memakai sertifikat TLS domain lain -> browser
                   menolaknya dan media tidak pernah tampil. Pakai i.ibb.co.com. */
                function normalizeMediaUrl(u) {
                    let s = String(u || "")
                        .replace(/\s+/g, "")
                        .trim();
                    s = s.replace(/^(https?:)?\/\/i\.ibb\.co\//i, "https://i.ibb.co.com/");
                    return s;
                }
                function photoIsVideo(p) {
                    const url = String(photoUrl(p));
                    return String(p.type || "").toLowerCase() === "video" || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url);
                }

                function avatarHTML(u) {
                    const initial = (u.name || "?").charAt(0).toUpperCase();
                    if (u.profile) {
                        return `<img class="row-avatar" src="${esc(u.profile)}" alt="${esc(u.name)}" loading="lazy" draggable="false" referrerpolicy="no-referrer">`;
                    }
                    return `<div class="row-avatar fallback">${esc(initial)}</div>`;
                }
                function badgeHTML(u) {
                    if (u.suspended) return `<span class="user-badge is-suspend">Suspend</span>`;
                    if (u.unregistered) return `<span class="user-badge is-unreg">Tidak Terdaftar</span>`;
                    return `<span class="user-badge is-active">Aktif</span>`;
                }

                /* ── Tab: Statistik ── */
                function renderStats() {
                    const total = TOTAL_COUNT;
                    const active = USERS.filter(u => !u.suspended && !u.unregistered);
                    const suspended = USERS.filter(u => u.suspended);
                    const videos = ALL_PHOTOS.filter(photoIsVideo).length;
                    const photos = total - videos;

                    const cards = [
                        { label: "Media", value: total, mod: "" },
                        { label: "Foto", value: photos, mod: "" },
                        { label: "Video", value: videos, mod: "" },
                        { label: "Aktif", value: active.length, mod: "is-active" },
                        { label: "Suspend", value: suspended.length, mod: "is-suspend" },
                        { label: "User", value: USERS.length, mod: "" },
                    ]
                        .map(
                            c => `
          <div class="stat-card ${c.mod}">
            <div class="stat-value" data-n="${c.value}">0</div>
            <div class="stat-label">${c.label}</div>
          </div>`,
                        )
                        .join("");

                    const rows = USERS.filter(u => u.photos.length)
                        .map(u => {
                            const pct = total ? (u.photos.length / total) * 100 : 0;
                            const userVideos = u.photos.filter(photoIsVideo).length;
                            return `
        <div class="chart-row user-row" data-key="${esc(u.key)}">
          <div class="row-head">
            ${avatarHTML(u)}
            <div class="row-info">
              <div class="row-name">${esc(u.name)}</div>
              ${userVideos ? `<div class="row-media">${userVideos} video</div>` : ""}
            </div>
            ${badgeHTML(u)}
            <span class="row-caret" aria-hidden="true">›</span>
            <div class="row-value">
              <span class="row-count" data-n="${u.photos.length}">0</span>
              <span class="row-pct" data-p="${pct}">0%</span>
            </div>
          </div>
          <div class="row-bar"><div class="row-bar-fill" data-w="${pct}"></div></div>
        </div>`;
                        })
                        .join("");

                    PANEL_STATS.innerHTML = `
      <div class="stat-grid">${cards}</div>
      <div class="chart">
        <div class="chart-head"><span>Uploader</span><span>Distribusi</span></div>
        <div class="chart-rows">${rows}</div>
      </div>`;

                    PANEL_STATS.querySelectorAll("[data-n]").forEach(el =>
                        animateNumber(el, parseInt(el.dataset.n, 10)),
                    );
                    PANEL_STATS.querySelectorAll("[data-p]").forEach(el =>
                        animatePercent(el, parseFloat(el.dataset.p)),
                    );
                    setTimeout(applyBars, 150);

                    // Klik baris -> pindah ke tab Detail & buka user tsb.
                    PANEL_STATS.querySelectorAll(".chart-row.user-row").forEach(row => {
                        row.addEventListener("click", () => {
                            switchTab("detail");
                            focusUser(row.dataset.key);
                        });
                    });
                }

                /* Isi lebar progress bar (chart + daftar user) */
                function applyBars() {
                    document.querySelectorAll("[data-w]").forEach(el => {
                        el.style.width = el.dataset.w + "%";
                    });
                }

                /* ── Tab: Detail User (aktif & suspend, beserta fotonya) ── */
                function renderDetail() {
                    const active = USERS.filter(u => !u.suspended && !u.unregistered);
                    const suspended = USERS.filter(u => u.suspended);
                    const unregistered = USERS.filter(u => u.unregistered);

                    const group = (title, dot, arr) => {
                        if (!arr.length) return "";
                        const items = arr.map(u => userItemHTML(u)).join("");
                        return `
      <div class="user-group">
        <div class="user-group-head">
          <span class="group-dot ${dot}"></span>
          <span>${title}</span>
          <span class="group-count">${arr.length}</span>
        </div>
        ${items}
      </div>`;
                    };

                    PANEL_DETAIL.innerHTML = `
      ${group("User Aktif", "is-active", active)}
      ${group("User Suspend", "is-suspend", suspended)}
      ${group("Tidak Terdaftar", "is-unreg", unregistered)}`;

                    PANEL_DETAIL.querySelectorAll(".user-row").forEach(btn => {
                        btn.addEventListener("click", () => {
                            const item = btn.closest(".user-item");
                            if (!item) return;
                            toggleUser(item.dataset.key);
                        });
                    });
                    PANEL_DETAIL.querySelectorAll(".up-row").forEach(btn => {
                        btn.addEventListener("click", () => {
                            const item = btn.closest(".up-item");
                            if (!item) return;
                            togglePhoto(item.dataset.pid);
                        });
                    });
                    initPlayers(PANEL_DETAIL);
                    setTimeout(applyBars, 150);
                }

                /* ── Player video: Plyr (self-hosted, tanpa CDN) ── */
                function initPlayers(root) {
                    if (typeof Plyr === "undefined") return;
                    root.querySelectorAll("video[data-plyr]").forEach(v => {
                        if (v.__plyr) return;
                        v.__plyr = new Plyr(v, {
                            invertTime: false,
                            loadSprite: true,
                            clickToPlay: true,
                            keyboard: { focused: true, global: false },
                            controls: [
                                "play-large",
                                "play",
                                "progress",
                                "current-time",
                                "duration",
                                "mute",
                                "volume",
                                "fullscreen",
                            ],
                            tooltips: { controls: true, seek: true },
                        });
                    });
                }

                function userItemHTML(u) {
                    const pct = TOTAL_COUNT ? (u.photos.length / TOTAL_COUNT) * 100 : 0;
                    const videos = u.photos.filter(photoIsVideo).length;
                    const reason = u.suspended && u.reason ? `<div class="user-reason">${esc(u.reason)}</div>` : "";
                    const photos = u.photos.length
                        ? `<div class="user-photos">${u.photos.map((p, i) => upRowHTML(p, i, u.key)).join("")}</div>`
                        : `<div class="user-empty">Belum ada media</div>`;
                    const breakdown = u.photos.length
                        ? `${u.photos.length} media${videos ? " · " + videos + " video" : ""} · ` +
                          `<span class="row-pct-inline">${pct.toFixed(1)}%</span>`
                        : "";

                    return `
      <div class="user-item" data-key="${esc(u.key)}">
        <button class="user-row" type="button" aria-expanded="false">
          <span class="user-row-main">
            ${avatarHTML(u)}
            <span class="row-info">
              <span class="row-name">${esc(u.name)}</span>
              <span class="row-sub">${breakdown}</span>
            </span>
            ${badgeHTML(u)}
            <span class="user-caret">›</span>
          </span>
          <span class="user-bar"><span class="user-bar-fill" data-w="${pct}"></span></span>
        </button>
        ${reason}
        <div class="user-expand"><div class="user-expand-inner">${photos}</div></div>
      </div>`;
                }

                function upRowHTML(p, i, userKey) {
                    const name = photoName(p, i);
                    const date = photoDate(p);
                    const url = photoUrl(p);
                    const isVideo = photoIsVideo(p);
                    const id = String(p.name == null ? "" : p.name).trim();
                    const pid = (userKey || "") + "::" + i;

                    const thumb = !url
                        ? `<span class="up-thumb"></span>`
                        : isVideo
                          ? `<span class="up-thumb"><span class="up-video">VIDEO</span></span>`
                          : `<span class="up-thumb"><img src="${esc(url)}" alt="" loading="lazy" decoding="async" draggable="false" referrerpolicy="no-referrer"></span>`;

                    const info = `
          <span class="up-info">
            <span class="up-name">#${esc(name)}</span>
            <span class="up-date">${esc(date)}</span>
          </span>`;

                    // Pratinjau dibuka DI DALAM halaman ini (expand di dalam expand),
                    // bukan navigasi ke halaman lain.
                    let preview = "";
                    if (url) {
                        const media = isVideo
                            ? `<video class="up-full" data-plyr src="${esc(url)}" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>`
                            : `<img class="up-full" src="${esc(url)}" alt="#${esc(name)}" loading="lazy" decoding="async" draggable="false" referrerpolicy="no-referrer">`;
                        preview = `
          <div class="up-view"><div class="up-view-inner">
            ${media}
            <div class="up-view-actions">
              <span class="up-date">#${esc(name)} · ${esc(date)}</span>
              ${id ? `<a class="up-link" href="/photo/?name=${encodeURIComponent(id)}" target="_blank" rel="noopener">Halaman foto</a>` : ""}
            </div>
          </div></div>`;
                    }

                    return `
      <div class="up-item" data-pid="${esc(pid)}">
        <button class="up-row" type="button" aria-expanded="false">
          ${thumb}${info}
          <span class="up-caret" aria-hidden="true">›</span>
        </button>${preview}
      </div>`;
                }

                /* ── Tab switching ── */
                function switchTab(name) {
                    document.querySelectorAll(".tab-btn").forEach(b => {
                        const on = b.dataset.tab === name;
                        b.classList.toggle("is-active", on);
                        b.setAttribute("aria-selected", String(on));
                    });
                    PANEL_STATS.classList.toggle("hidden", name !== "stats");
                    PANEL_DETAIL.classList.toggle("hidden", name !== "detail");
                }

                function focusUser(key) {
                    let target = null;
                    PANEL_DETAIL.querySelectorAll(".user-item").forEach(it => {
                        if (it.dataset.key === key) target = it;
                    });
                    if (!target) return;
                    closePhotos();
                    closeUsers();
                    target.classList.add("open");
                    const btn = target.querySelector(".user-row");
                    if (btn) btn.setAttribute("aria-expanded", "true");
                    target.scrollIntoView({ behavior: "smooth", block: "start" });
                }

                /* ── Accordion: hanya 1 user yang boleh terbuka ── */
                function closePhotos() {
                    PANEL_DETAIL.querySelectorAll(".up-item.open").forEach(el => {
                        el.classList.remove("open");
                        const b = el.querySelector(".up-row");
                        if (b) b.setAttribute("aria-expanded", "false");
                        // Jeda video supaya suara tidak tetap berbunyi saat ditutup.
                        const v = el.querySelector("video");
                        if (v) {
                            try {
                                v.pause();
                            } catch (e) {
                                /* diabaikan */
                            }
                        }
                    });
                }
                function closeUsers() {
                    PANEL_DETAIL.querySelectorAll(".user-item.open").forEach(el => {
                        el.classList.remove("open");
                        const b = el.querySelector(".user-row");
                        if (b) b.setAttribute("aria-expanded", "false");
                    });
                }
                function toggleUser(key) {
                    const items = Array.from(PANEL_DETAIL.querySelectorAll(".user-item"));
                    const target = items.find(el => el.dataset.key === key);
                    if (!target) return;
                    const wasOpen = target.classList.contains("open");
                    closePhotos();
                    closeUsers();
                    if (!wasOpen) {
                        target.classList.add("open");
                        const b = target.querySelector(".user-row");
                        if (b) b.setAttribute("aria-expanded", "true");
                    }
                }
                /* ── Accordion di dalam: hanya 1 foto yang boleh terbuka ── */
                function togglePhoto(pid) {
                    const items = Array.from(PANEL_DETAIL.querySelectorAll(".up-item"));
                    const target = items.find(el => el.dataset.pid === pid);
                    if (!target) return;
                    const wasOpen = target.classList.contains("open");
                    closePhotos();
                    if (!wasOpen) {
                        target.classList.add("open");
                        const b = target.querySelector(".up-row");
                        if (b) b.setAttribute("aria-expanded", "true");
                    }
                }

                document.querySelectorAll(".tab-btn").forEach(btn => {
                    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
                });

                /* ── Render ── */
                function render(photos, status) {
                    ALL_PHOTOS = photos;
                    TOTAL_COUNT = photos.length;
                    USERS = buildUsers(photos, status);

                    renderStats();
                    renderDetail();

                    PILL_MEDIA.textContent = TOTAL_COUNT;
                    const videos = photos.filter(photoIsVideo).length;
                    PILL_BREAKDOWN.textContent = videos + " video · " + (TOTAL_COUNT - videos) + " foto";
                    PILL_USERS.textContent = USERS.length + " user";
                    PILL.classList.add("show");
                }

                /* ── fetch ── */
                Promise.all([
                    fetch(PHOTOS_URL + "?t=" + Date.now(), { cache: "no-store" }).then(r => {
                        if (!r.ok) throw new Error("photos.json: HTTP " + r.status);
                        return r.json();
                    }),
                    fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" })
                        .then(r => {
                            if (!r.ok) throw new Error("status.json: HTTP " + r.status);
                            return r.json();
                        })
                        .catch(err => {
                            console.warn("status.json gagal, lanjut tanpa profil:", err);
                            return null;
                        }),
                ])
                    .then(([photos, status]) => {
                        if (!Array.isArray(photos) || photos.length === 0) {
                            throw new Error("photos.json kosong atau bukan array");
                        }
                        render(photos, status);
                    })
                    .catch(err => {
                        PANEL_STATS.innerHTML = `<div class="state-msg">
        <p style="color:var(--blue);font-weight:600;margin-bottom:.5rem;">Gagal memuat data</p>
        <p style="font-size:.82rem;color:var(--faint);">${esc(err.message)}</p>
      </div>`;
                    });
            })();
        </script>
        <script>
            /* Anti-copy / anti-save: konten galeri hanya bisa diunduh lewat aplikasi. */
            (function () {
                "use strict";

                /* Isian milik user sendiri (form upload, pencarian) tetap boleh disalin. */
                function isEditable(el) {
                    if (!el || !el.tagName) return false;
                    var tag = el.tagName.toLowerCase();
                    if (tag === "input" || tag === "textarea" || tag === "select") return true;
                    return !!el.isContentEditable;
                }

                /* Klik kanan: blokir menu simpan / salin / cetak. */
                document.addEventListener("contextmenu", function (e) {
                    e.preventDefault();
                });

                /* Seret & lepas: blokir "save image as" dan drag ke disk. */
                document.addEventListener("dragstart", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("dragover", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("drop", function (e) {
                    e.preventDefault();
                });

                /* Salin & potong teks: teks halaman tidak bisa disalin. */
                document.addEventListener("copy", function (e) {
                    if (isEditable(e.target) || isEditable(document.activeElement)) return;
                    e.preventDefault();
                });
                document.addEventListener("cut", function (e) {
                    if (isEditable(e.target) || isEditable(document.activeElement)) return;
                    e.preventDefault();
                });
                document.addEventListener("selectstart", function (e) {
                    if (isEditable(e.target)) return;
                    e.preventDefault();
                });

                /* Pintasan keyboard: salin, potong, pilih semua, simpan, cetak, lihat sumber. */
                document.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if (!e.ctrlKey && !e.metaKey) return;
                    if (k === "s" || k === "p" || k === "u") {
                        e.preventDefault();
                        return;
                    }
                    if ((k === "c" || k === "x" || k === "a") && !isEditable(e.target)) {
                        e.preventDefault();
                    }
                });

                /* Gaya anti-seleksi + anti long-press "simpan ke layar" (iOS/Android). */
                var style = document.createElement("style");
                style.textContent =
                    "html,body,body *:not(input):not(textarea):not(select){" +
                    "-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;" +
                    "-webkit-touch-callout:none;}" +
                    "input,textarea,[contenteditable]{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}" +
                    "img,video{-webkit-user-drag:none;-webkit-touch-callout:none;}";
                (document.head || document.documentElement).appendChild(style);
            })();
        </script>
    </body>
</html>
