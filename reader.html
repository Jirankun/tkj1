<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Reader</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --accent: #3b82f6;
            --text: #e5e5e5;
        }

        /* --- PROTEKSI ANTI COPAS & SELEKSI --- */
        * {
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --- VIEWER AREA --- */
        .viewer-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        #main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.2s ease-in-out;
            /* Kunci anti drag & anti long-press save di mobile */
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none; 
        }

        /* --- OVERLAY CONTROLS --- */
        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .page-counter {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: auto;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .btn-control {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            pointer-events: auto;
        }

        .btn-control:hover { background: var(--accent); border-color: var(--accent); }
        .btn-control:active { transform: scale(0.95); }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            background: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .list-item {
            padding: 12px 20px;
            cursor: pointer;
            border-left: 3px solid transparent;
            color: #aaa;
            font-size: 14px;
            transition: 0.2s;
        }

        .list-item:hover { background: #2a2a2a; color: #fff; }
        .list-item.active { 
            background: rgba(59, 130, 246, 0.1); 
            color: var(--accent); 
            border-left-color: var(--accent); 
        }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed !important;
                right: 0 !important;
                top: 0 !important;
                bottom: 0 !important;
                transform: translateX(100%) !important;
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
                z-index: 100 !important;
            }
            
            .sidebar.open { 
                transform: translateX(0) !important;
            }
            
            .btn-control { 
                padding: 12px 20px; 
            }
            
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.7);
                z-index: 99;
            }
            
            .sidebar-overlay.show {
                display: block;
            }
        }
        
        @media (min-width: 769px) {
            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<!-- Proteksi level HTML: matiin right click, drag, dan select dari akar -->
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <!-- Overlay gelap untuk mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Area Gambar -->
    <div class="viewer-container" id="touch-area">
        <div class="overlay-top">
            <div style="pointer-events: auto;">
                <button class="btn-control" onclick="toggleSidebar()">☰ Daftar</button>
            </div>
            <div class="page-counter" id="page-info">Memuat...</div>
        </div>

        <!-- Proteksi level HTML di image -->
        <img id="main-image" src="" alt="Reader" oncontextmenu="return false;" ondragstart="return false;">

        <div class="overlay-bottom">
            <button class="btn-control" onclick="changePage(-1)">❮ Prev</button>
            <button class="btn-control" onclick="changePage(1)">Next ❯</button>
        </div>
    </div>

    <!-- Sidebar Kanan -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="sidebar-header">
            Daftar Halaman
            <button class="btn-close" onclick="toggleSidebar()">×</button>
        </div>
        <div class="gallery-list" id="gallery-list"></div>
    </div>

    <script>
        let urls = [];
        let currentIndex = 0;
        const imgEl = document.getElementById('main-image');
        const listEl = document.getElementById('gallery-list');
        const infoEl = document.getElementById('page-info');
        const sidebar = document.getElementById('sidebar');
        const sidebarHeader = document.getElementById('sidebar-header');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        // --- PROTEKSI LEVEL JAVASCRIPT ---
        // 1. Blok Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Blok Drag & Drop
        document.addEventListener('dragstart', event => event.preventDefault());
        document.addEventListener('drop', event => event.preventDefault());

        // 3. Blok Copy, Cut, Paste
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());

        // 4. Blok Shortcut Jahat (Ctrl+S, Ctrl+U, Ctrl+C, F12)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'u' || e.key === 'c' || e.key === 'p')) {
                e.preventDefault();
            }
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });

        // 1. FETCH DATA DARI JSON
        fetch('https://tkj1.pages.dev/DB/photos.json')
            .then(res => res.json())
            .then(data => {
                if (data && Array.isArray(data.photos)) {
                    urls = data.photos.map(item => item.url);
                    initGallery();
                } else {
                    infoEl.innerText = "Format JSON Error, jing!";
                }
            })
            .catch(err => {
                infoEl.innerText = "Gagal memuat data, bangsat!";
                console.error(err);
            });

        function initGallery() {
            sidebarHeader.querySelector('span') ? null : sidebarHeader.innerHTML = `Daftar Halaman (${urls.length})<button class="btn-close" onclick="toggleSidebar()">×</button>`;
            
            listEl.innerHTML = '';
            urls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerText = `Halaman ${index + 1}`;
                div.onclick = () => {
                    goTo(index);
                    if (window.innerWidth <= 768) closeSidebar();
                };
                listEl.appendChild(div);
            });

            const hash = window.location.hash.replace('#page-', '');
            const targetIndex = parseInt(hash) - 1;
            
            if (!isNaN(targetIndex) && targetIndex >= 0 && targetIndex < urls.length) {
                goTo(targetIndex);
            } else {
                goTo(0);
            }
        }

        function goTo(index) {
            if (index < 0 || index >= urls.length) return;
            
            currentIndex = index;
            infoEl.innerText = `${index + 1} / ${urls.length}`;
            
            imgEl.style.opacity = '0.5';
            imgEl.src = urls[index];
            
            imgEl.onload = () => { 
                imgEl.style.opacity = '1'; 
            };
            
            imgEl.onerror = () => { 
                imgEl.style.opacity = '1'; 
                infoEl.innerText = `Gagal muat gambar ${index + 1}`;
            };

            history.replaceState(null, null, `#page-${index + 1}`);

            document.querySelectorAll('.list-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            
            const activeItem = document.querySelector('.list-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        window.changePage = (dir) => goTo(currentIndex + dir);
        
        window.toggleSidebar = () => {
            const isOpen = sidebar.classList.contains('open');
            if (isOpen) {
                closeSidebar();
            } else {
                openSidebar();
            }
        };
        
        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('show');
            document.body.style.overflow = '';
        }

        // 3. SWIPE LOGIC (MOBILE)
        let touchStartX = 0;
        const viewer = document.getElementById('touch-area');

        viewer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        viewer.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) changePage(1);
                else changePage(-1);
            }
        }, {passive: true});

        // Keyboard Support
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') changePage(1);
            if (e.key === 'ArrowLeft') changePage(-1);
            if (e.key === 'Escape') closeSidebar();
        });
    </script>
</body>
</html>
