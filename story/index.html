<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.8" />
        <link rel="icon" type="image/png" href="../assets/ic.webp" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#060B14" />
        <meta name="robots" content="noindex" />
        <title>Cerita — TKJ OnE</title>
        <link rel="stylesheet" href="../code/css/gallery/theme.css" />
        <link rel="stylesheet" href="../assets/fa/css/all.min.css" />
        <link rel="stylesheet" href="../assets/plyr/plyr.css" />
        <link rel="stylesheet" href="../code/css/gallery/story.css" />
    </head>
    <body>
        <div class="stage" id="stage">
            <div class="bars" id="bars"></div>

            <div class="head">
                <div class="avatar">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                </div>
                <div class="head-text">
                    <span class="head-title">TKJ OnE</span>
                    <span class="head-sub" id="headSub">Cerita terbaru</span>
                </div>
            </div>

            <div class="frame" id="frame"></div>

            <div class="zones">
                <button class="zone prev" id="zonePrev" type="button" aria-label="Sebelumnya"></button>
                <button class="zone" id="zoneNext" type="button" aria-label="Berikutnya"></button>
            </div>

            <button class="pause" id="pauseBtn" type="button" aria-label="Jeda">
                <i class="fa-solid fa-pause pause-ico" aria-hidden="true"></i>
                <i class="fa-solid fa-play play-ico" aria-hidden="true"></i>
            </button>

            <div class="caption">
                <div class="caption-name" id="capName">—</div>
                <div class="caption-meta" id="capMeta"></div>
            </div>

            <div class="loader" id="loader">
                <div class="ring"></div>
                <span>Memuat cerita…</span>
            </div>
        </div>

        <nav class="tabbar" aria-label="Navigasi utama">
            <a class="tab" href="../galeri/">
                <i class="fa-solid fa-images" aria-hidden="true"></i>
                <span>Galeri</span>
            </a>
            <a class="tab" href="./" aria-current="page">
                <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
                <span>Cerita</span>
            </a>
        </nav>

        <script src="../assets/plyr/plyr.js"></script>
        <script src="../code/js/gallery/story.js"></script>
        <script src="../code/js/gallery/anti-copy.js"></script>
    </body>
</html>
